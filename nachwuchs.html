function asList(items, emptyMsg){
  if (!items.length) return `<div class="empty" style="padding:20px">${emptyMsg}</div>`;
  const groups = {};
  items.forEach(e => (groups[asDir(e)] ||= []).push(e));
  // Unterteilung nach Disziplin (Jumps │ Rails │ Halfpipe), Jumps zusätzlich nach Drehrichtung
  const discOf = d => d==='Rails' ? 'Rail' : d==='Halfpipe' ? 'Halfpipe' : 'Jump';
  let lastDisc = null;
  return AS_DIR_ORDER.filter(d => groups[d]).map(d => {
    groups[d].sort((a,b) => (+(b.trick?.rot)||0) - (+(a.trick?.rot)||0));
    const disc = discOf(d), n = items.filter(e => discOf(asDir(e))===disc).length;
    const title = '';   // Disziplin wird oben über die Knöpfe gewählt
    lastDisc = disc;
    const bar = disc==='Jump' ? `<div class="dir-h"><i class="dir-dot" style="background:${AS_DIR_COL[d]}"></i>${d}<span class="n">${groups[d].length}</span></div>` : '';
    return `${title}<div class="dir-group">${bar}${groups[d].map(asRow).join('')}</div>`;
  }).join('');
}
// Netz nach Drehrichtung (Emilie 2.11.2026): vier Achsen Left / Right / Switch Left / Switch Right
// (Snowboard: Frontside / Backside / Switch …), 180 innen, höchste Rotation aussen.
// Eine Linie pro Disziplin im Fokus = höchste gelernte Rotation in dieser Richtung (aus dem Assessment).
const DIR_ORDER = ['L', 'R', 'SR', 'SL'];   // oben links, oben rechts, unten rechts, unten links (Left-Seite links, Right-Seite rechts)
const RADAR_LINES = {Jump:'#E2001A', Rail:'#148FA0', Halfpipe:'#3A3A3A'};
const degOf = v => +((/(\d{3,4})/.exec(String(v || '')) || [])[1] || 0);
// Richtung und Rotation eines Tricks (null = keine Rotation, z.B. Flip ohne Spin oder Slide)
function dirRot(disc, t){
  if (!t) return null;
  if (disc==='Jump'){ const r = +t.rot || 0; return D4.includes(t.dir) && r ? {dir:t.dir, rot:r} : null; }
  if (disc==='Halfpipe'){ const r = +t.rot || 0; return t.kind!=='basic' && ['L','R'].includes(t.dir) && r ? {dir:(t.sw ? 'S' : '') + t.dir, rot:r} : null; }
  if (SB){   // Snowboard-Rail: «Switch BS 270», «FS 450 out»
    const sp = [t.inspin, t.outspin].filter(Boolean), r = Math.max(0, ...sp.map(degOf));
    const ref = t.inspin || t.outspin || ''; if (!r) return null;
    const side = /\bBS\b/.test(ref) ? 'R' : 'L';
    return {dir:(/switch/i.test(ref) ? 'S' : '') + side, rot:r};
  }
  const r = Math.max(degOf(t.on), degOf(t.out), degOf(t.swap)); if (!r || !['L','R'].includes(t.side)) return null;
  return {dir:(t.approach==='S' ? 'S' : '') + t.side, rot:r};
}
const learnedEntry = e => e.status!=='goal' || e.trick?.elite_status==='mastered';
function radarCard(ath){
  if (!ath) return '';
  const discs = focusDiscs(ath, ath.level || 'T4');
  const ents = entriesOf(ath.id).filter(learnedEntry);
  // höchste Rotation pro Disziplin und Richtung (+ Trickname für die Anzeige)
  const best = {};
  for (const d of discs){ best[d] = {};
    for (const e of ents.filter(x => x.discipline===d)){ const dr = dirRot(d, e.trick); if (!dr) continue;
      if (!best[d][dr.dir] || dr.rot > best[d][dr.dir].rot) best[d][dr.dir] = {rot:dr.rot, label:e.label}; } }
  const any = discs.some(d => Object.keys(best[d]).length);
  const top = Math.max(0, ...discs.flatMap(d => Object.values(best[d]).map(b => b.rot)));
  const MAX = Math.max(ath.gender==='W' ? 1260 : 1800, Math.ceil(top / 180) * 180);
  const W = 460, C = W / 2, R0 = 22, R = 175, rad = v => R0 + (R - R0) * (v - 180) / (MAX - 180), f1 = v => v.toFixed(1);
  const ang = k => -3 * Math.PI / 4 + k * Math.PI / 2, pt = (r, a) => [C + r * Math.cos(a), C + r * Math.sin(a)];
  let g = '';
  // Ringe alle 180°, jeder zweite (360, 720, …) beschriftet
  for (let v = 180; v <= MAX; v += 180){
    const strong = (v % 360 === 0 && MAX - v >= 360) || v === MAX;
    g += `<circle cx="${C}" cy="${C}" r="${f1(rad(v))}" fill="${v===MAX ? '#FAF7F6' : 'none'}" stroke="${v===MAX ? '#93A7BB' : strong ? '#DDD6D3' : '#EFEAE8'}" stroke-width="${v===MAX ? 2 : 1}"/>`;
    if (strong || v === 180){ const [x, y] = pt(rad(v), -Math.PI / 2);
      g += `<text x="${f1(x)}" y="${f1(y + 4)}" text-anchor="middle" font-size="13" font-weight="700" fill="#93a7bb" paint-order="stroke" stroke="#fff" stroke-width="3">${v}</text>`; }
  }
  // Achsen + Richtungsnamen
  DIR_ORDER.forEach((d, k) => {
    const [x, y] = pt(R + 4, ang(k)), [lx, ly] = pt(R + 22, ang(k));
    g += `<line x1="${C}" y1="${C}" x2="${f1(x)}" y2="${f1(y)}" stroke="#DDD6D3"/>`;
    const anchor = k===1 || k===2 ? 'start' : 'end';
    g += `<text x="${f1(lx)}" y="${f1(ly + (k < 2 ? -2 : 14))}" font-size="19" font-weight="800" fill="#3A3A3A" text-anchor="${anchor}">${esc(DIRN[d])}</text>`;
  });
  // Linien pro Disziplin
  for (const d of discs){
    const col = RADAR_LINES[d], pts = DIR_ORDER.map((dir, k) => { const b = best[d][dir]; return {b, p:pt(b ? rad(b.rot) : 0, ang(k))}; });
    if (!pts.some(x => x.b)) continue;
    g += `<polygon points="${pts.map(x => x.p.map(f1).join(',')).join(' ')}" fill="${col}" fill-opacity=".10" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    g += pts.filter(x => x.b).map(x => `<circle cx="${f1(x.p[0])}" cy="${f1(x.p[1])}" r="5.5" fill="${col}" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="radarTip(this)"><title>${esc(DISC_LABEL[d])}: ${esc(x.b.label)} (${x.b.rot})</title></circle>`).join('');
  }
  const legend = discs.map(d => `<span><i style="background:${RADAR_LINES[d]}"></i>${esc(DISC_LABEL[d])}</span>`).join('');
  return `<div class="card"><h2>Rotation per direction <span class="muted" style="letter-spacing:0;font-weight:600">180 inside · ${MAX} outside</span></h2>
    ${any ? '' : '<div class="tiny muted" style="margin:6px 0">No learned spins yet: as soon as tricks are entered as learned, the lines appear here.</div>'}
    <div class="radars one"><div class="radar"><svg viewBox="-110 -30 ${W + 220} ${W + 60}" role="img" aria-label="Rotation per direction">${g}</svg></div></div>
    <div class="radar-legend">${legend}<span>Line = highest learned rotation per direction</span><span>Tap a point for the trick</span></div></div>`;
}

// Fokus ab T4: nur Halfpipe ('hp') oder nur Jumps + Rails ('park'); darunter zählen immer alle drei.
const FOCUS = {'':'All disciplines', park:'Jumps & Rails only', hp:'Halfpipe only'};
const FOCUS_DISCS = {park:['Jump','Rail'], hp:['Halfpipe']};
const focusDiscs = (ath, level) => level==='T4' && FOCUS_DISCS[ath.focus] ? FOCUS_DISCS[ath.focus] : DISCS;
// Weg über alle Stufen T1–T4 (Emilie 2.11.2026): Punkte aller Skills-Checks zusammen, damit Fortschritt
// auch sichtbar ist, wenn die eigene Stufe noch weit weg ist. Fokus wie auf der eigenen Stufe.
function pathTotals(ath, ents = entriesOf(ath.id)){
  if (!HAS_SC) return null;
  const incl = focusDiscs(ath, ath.level || 'T4'), by = {};
  for (const d of DISCS){
    const r = {pts:0, max:0, lv:{}};
    for (const lv of ['T1','T2','T3','T4']){ const ev = evaluate(d, ath.gender, lv, ents); r.lv[lv] = ev ? {pts:ev.pts, max:ev.max} : {pts:0, max:0}; if (ev){ r.pts += ev.pts; r.max += ev.max; } }
    by[d] = r;
  }
  // Mittel der Disziplinen im Fokus (gleich gewichtet wie das Total)
  const avg = get => { const parts = incl.map(d => get(by[d])).filter(x => x.max > 0).map(x => x.pts / x.max);
    return parts.length ? Math.round(parts.reduce((x, y) => x + y, 0) / parts.length * 100) : 0; };
  const lv = {}; for (const l of ['T1','T2','T3','T4']) lv[l] = avg(r => r.lv[l]);
  return {by, incl, lv, pct: avg(r => r)};
}
function levelTotals(ath, level, ents = entriesOf(ath.id)){
  if (!HAS_SC) return null;
  const incl = focusDiscs(ath, level);
  const r = {pts:0, max:0, done:0, n:0, pending:0, by:{}, incl};
  for (const d of DISCS){
    const ev = evaluate(d, ath.gender, level, ents); if (!ev) continue;
    r.by[d] = ev;
    if (!incl.includes(d)) continue;
    r.pts += ev.pts; r.max += ev.max; r.done += ev.done; r.n += ev.n; r.pending += ev.pending;
  }
  // Total: jede zählende Disziplin gleich gewichtet (⅓ bzw. ½ bzw. ganz): unabhängig von der Anzahl Vorgaben
  const parts = incl.map(d => r.by[d]).filter(ev => ev && ev.max > 0).map(ev => ev.pts / ev.max);
  r.pct = parts.length ? Math.round(parts.reduce((a, b) => a + b, 0) / parts.length * 100) : 0;
  return r;
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
/* PISTE App: Skills-Check-Prozente pro Athlet:in ablegen, PISTE holt sie ab (Update 14).
   Zählt wie die Selektion: nur Bewertungen mit Video. Nach dem Stichtag 30.4. bleibt der Stand eingefroren. */
const pisteSeason = () => { const e = selectionDeadline().getUTCFullYear(); return `${e - 1}/${String(e).slice(2)}`; };
function snapshotOf(a){
  if (!HAS_SC || !a?.level || !a.gender) return null;
  const t = levelTotals(a, a.level, entriesOf(a.id).filter(e => e.status!=='reviewed' || e.video_path)); if (!t) return null;
  const dp = d => t.by[d] && t.incl.includes(d) && t.by[d].max ? pct(t.by[d].pts, t.by[d].max) : null;
  return {athlete_id:a.id, season:pisteSeason(), level:a.level, jumps:dp('Jump'), rails:dp('Rail'), hp:dp('Halfpipe'), total:t.pct, updated_at:nowIso()};
}
async function pushSnapshots(aths){
  if (DEMO || isPreview() || !HAS_SC || selFrozen() || !['coach','dvlp'].includes(ST.me?.role)) return;
  try { await Store.pushSnapshots(aths.filter(Boolean).map(snapshotOf).filter(Boolean)); } catch (err){ console.warn('PISTE snapshot', err); }
}
function progressBar(ev){
  const part = Object.values(ev.out).filter(o => o.state==='partial').reduce((s, o) => s + o.pts, 0);
  const full = ev.pts - part;
  return `<div class="bar"><i class="b-done" style="width:${pct(full, ev.max)}%"></i><i class="b-part" style="width:${pct(part, ev.max)}%"></i></div>`;
}
// Gleiche Anforderung mehrfach (z.B. «3 verschiedene 450 in») → ein Block mit nummerierten Plätzen
function slotGroups(slots){
  const out = [];
  for (const s of slots){
    const last = out[out.length - 1];
    const same = last && (s.doc ? last[0].doc===s.doc : (s.grp && s.key==='id' && last[0].grp===s.grp && last[0].text===s.text));
    if (same) last.push(s); else out.push([s]);
  }
  return out;
}

  if (e.kudos_at){ if (confirm(trString('Remove the shout-out for this trick?'))) saveKudos(id, false); return; }

  modal(`<h2>Shout-out</h2><div class="muted small" style="margin-bottom:12px">${esc(e.label)} · ${esc(prof(e.athlete_id)?.name || '')}</div>

async function saveKudos(id, on){
  const e = ST.entries.find(x => x.id===id); if (!e) return;
  const msg = on ? ($('#kudos-msg')?.value || '').trim().slice(0, 80) : '';
  try {
    const saved = await Store.setKudos(ST.me, id, on, on ? ST._kudos || 'well_done' : null, msg || null);
    Object.assign(e, {kudos_at:saved.kudos_at, kudos_by:saved.kudos_by, kudos_kind:saved.kudos_kind, kudos_msg:saved.kudos_msg});
    closeModal(); toast(on ? 'Shout-out sent' : 'Shout-out removed'); render();
  } catch (err){ toast('Could not save: ' + (err.message||err), true); }
}

// Saison-Rückblick: Saison 1. Mai bis 30. April. Ab 1. Mai (nach dem Selektions-Stichtag) Rückblick der abgelaufenen Saison, den ganzen Mai hervorgehoben.
function reviewSeason(){
  const d = new Date(), y = d.getMonth() >= 4 ? d.getFullYear() : d.getFullYear() - 1;
  const after = d.getMonth() === 4;   // Mai: Rückblick der Saison, die am 30. April endete
  const start = after ? y - 1 : y;
  return {from:`${start}-05-01`, to:`${start + 1}-04-30`, label:`${start}/${String(start + 1).slice(2)}`, after};
}
function seasonStats(ath){
  const S = reviewSeason(), inS = iso => iso && iso.slice(0,10) >= S.from && iso.slice(0,10) <= S.to;
  const all = entriesOf(ath.id), c = all.filter(e => e.status==='reviewed' && e.video_path && inS(e.reviewed_at || e.created_at));
  const months = {}; c.forEach(e => { const m = (e.reviewed_at || e.created_at).slice(0,7); months[m] = (months[m] || 0) + 1; });
  const best = Object.entries(months).sort((a,b) => b[1] - a[1])[0];
  const dirs = new Set(jumpC(c).map(e => e.trick?.dir).filter(d => D4.includes(d)));
  const maxRot = Math.max(0, ...c.map(e => +e.trick?.rot || 0));
  const atts = isStaff() ? ST.attempts.filter(a => a.athlete_id===ath.id && inS(sessDate(a))) : [];
  return {S, n:c.length, jumps:jumpC(c).length, rails:c.filter(e => e.discipline==='Rail').length, hp:c.filter(e => e.discipline==='Halfpipe').length,
    full:c.filter(e => e.score === maxFor(e.discipline)).length, videos:all.filter(e => e.video_path && inS(e.created_at)).length,
    kudos:all.filter(e => e.kudos_at && inS(e.kudos_at)).length, dirs:dirs.size, maxRot, best,
    atts:atts.length, stomps:atts.filter(isStomp).length, badges:earnedBadges(ath).length};
}

let _h2c;
function loadHtml2Canvas(){ return _h2c ||= new Promise((res, rej) => { if (window.html2canvas) return res(window.html2canvas); const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; sc.onload = () => res(window.html2canvas); sc.onerror = () => { _h2c = null; rej(new Error('Image library could not be loaded')); }; document.head.appendChild(sc); }); }
async function saveSeasonImage(){
  try {
    const h2c = await loadHtml2Canvas(), el = document.getElementById('season-card');
    const canvas = await h2c(el, {scale:2, backgroundColor:null, useCORS:true});
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png')), file = new File([blob], 'Saison-Rueckblick.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file]}); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  } catch (err){ if (err?.name !== 'AbortError') toast('Could not create image: ' + (err.message||err), true); }
}

    <div id="rv-log"></div>
    <label class="f" style="margin-top:12px">Feedback for the athlete<textarea id="rv-note" placeholder="What was good, what to work on?">${esc(e.review_note||'')}</textarea></label>
    <div class="btnrow" style="align-items:center">
      ${e.video_path ? `<button class="btn red" id="rv-save" onclick="saveReview()">Save rating</button>` : `<button class="btn red" onclick="closeModal();pickVideo('${e.id}')">⬆ Upload video</button>`}
      <button class="btn ghost" onclick="saveReview('rework')">${e.video_path ? 'Request new video' : 'Request video'}</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <span class="grow"></span><div class="score-big" id="rv-score"></div>
    </div>`);
  renderCrit();
  Store.entryLog({entryId:e.id}).then(log => { const el = $('#rv-log'); if (el && log?.length) el.innerHTML = logHtml(log); });
  if (e.video_path){
    try { const url = await Store.videoUrl(e.video_path);
      $('#rv-video').innerHTML = url ? `<video src="${esc(url)}" controls playsinline></video>` : `<div class="rule" style="margin:14px 0">${DEMO ? 'Demo mode: the video was uploaded in another session and is no longer available.' : 'Video not found.'}</div>`; }
    catch (err){ $('#rv-video').innerHTML = `<div class="rule" style="margin:14px 0">Could not load video: ${esc(err.message||err)}</div>`; }
  }
}
function renderCrit(){
  const e = ST.entries.find(x => x.id===RV.id);
  const set = critSet(e);
  $('#rv-crit').innerHTML = set.map(c => { const v = RV.crit[c.k];
    return `<div class="crit"><button class="tog ${v===true?'yes':v===false?'no':''}" onclick="toggleCrit('${c.k}')" aria-label="${esc(c.name)}">${v===true?'✓':v===false?'✗':'?'}</button>
      <div><div class="cn">${esc(c.name)}</div><ul>${c.hints.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div></div>`; }).join('');
  const vals = Object.values(RV.crit);
  const score = vals.filter(v => v===true).length;
  $('#rv-score').innerHTML = vals.some(v => v===null) ? `<span class="muted small">${vals.filter(v => v!==null).length}/${vals.length} rated</span>` : `${stars(score, vals.length)} ${score}/${vals.length}`;
  if ($('#rv-save')) $('#rv-save').disabled = vals.some(v => v===null);
}
function toggleCrit(k){ const v = RV.crit[k]; RV.crit[k] = v===null ? true : v===true ? false : true; renderCrit(); }
async function saveReview(kind){
  const note = $('#rv-note').value.trim();
  // Bewertung nur mit Video (Vorgabe Emilie 28.9.2026)
  if (kind!=='rework' && !ST.entries.find(x => x.id===RV.id)?.video_path){ toast('A rating is only possible with a video', true); return; }
  const patch = kind==='rework'
    ? {status:'rework', crit:null, score:null, review_note:note || 'Please upload a new video.'}
    : {status:'reviewed', crit:{...RV.crit}, score:Object.values(RV.crit).filter(v => v===true).length, review_note:note || null};
  try {
    upsertLocal(await Store.review(ST.me, RV.id, patch));
    pushSnapshots([prof(ST.entries.find(x => x.id===RV.id)?.athlete_id)]);
    closeModal(); toast(kind==='rework' ? 'Athlete asked for a new video' : `Rated ${patch.score}/${Object.keys(patch.crit).length}: athlete notified`); render();
  } catch (err){ console.error(err); toast('Could not save: ' + (err.message||err), true); }
}

/* ══════════════════════════════════════════════════════════════════════
   SELEKTION (nur Admin): Rangliste pro Stufe und Geschlecht, Stichtag 30. April
   Vor dem Stichtag: aktueller Stand. Danach: eingefrorener Stand per Stichtag
   (aus dem Änderungsverlauf; ohne Verlauf: Bewertungen bis zum Stichtag).
   ══════════════════════════════════════════════════════════════════════ */
function selectionDeadline(d = new Date()){
  const y = d.getMonth() >= 7 ? d.getFullYear() + 1 : d.getFullYear();   // Saison Aug–Jul → Stichtag 30.4. im Saison-Endjahr
  return new Date(Date.UTC(y, 3, 30, 21, 59, 59));   // 30.4. 23:59:59 Schweizer Zeit (MESZ)
}
const selFrozen = () => Date.now() > selectionDeadline().getTime();
function logHtml(log){
  const nm = id => prof(id)?.name || '–';
  const lab = r => r.status==='reviewed' ? `${r.score}/${maxFor(r.discipline)}` : r.status==='rework' ? 'New video requested' : r.status==='pending' ? 'Submitted' : r.status==='goal' ? 'Goal' : r.action==='delete' ? 'Deleted' : r.status;
  const crits = r => r.status==='reviewed' && r.crit ? critSetFor(r.discipline).map(c => `<span class="lg-c ${r.crit[c.k] ? 'ok' : 'no'}">${r.crit[c.k] ? '✓' : '✗'} ${esc(c.name.replace(/ \(.*\)/, ''))}</span>`).join('') : '';
  const rated = log.filter(r => r.status==='reviewed'), people = new Set(rated.map(r => r.changed_by));
  return `<details class="rv-log" ${rated.length > 1 ? 'open' : ''}><summary>History (${log.length})</summary>
    ${rated.length > 1 ? `<div class="lg-note"><span>${people.size > 1 ? 'Rated by several people.' : 'Rated several times.'}</span> <span>The latest rating counts.</span></div>` : ''}
    <ul>${log.slice().reverse().map((r, i) => `<li class="${i===0 ? 'cur' : ''}"><div class="lg-h"><b>${esc(lab(r))}</b><span>${esc(nm(r.changed_by))}</span><span class="tiny muted">${fmtDate(r.changed_at)} ${new Date(r.changed_at).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'})}</span>${i===0 && r.status==='reviewed' ? '<span class="chip green">Counts</span>' : ''}</div>
      ${crits(r) ? `<div class="lg-cs">${crits(r)}</div>` : ''}${r.review_note ? `<div class="lg-n">${esc(r.review_note)}</div>` : ''}</li>`).join('')}</ul></details>`;
}
async function loadSelectionSnapshot(){
  const dl = selectionDeadline();
  if (!selFrozen()){ ST.sel = {frozen:false, ents:ST.entries}; return; }
  const log = await Store.entryLog({until:dl.toISOString()});
  let ents;
  if (log){
    const last = new Map(); for (const r of log) last.set(r.entry_id, r);   // aufsteigend sortiert → letzter Stand vor Stichtag
    ents = [...last.values()].filter(r => r.action!=='delete').map(r => ({id:r.entry_id, athlete_id:r.athlete_id, discipline:r.discipline, label:r.label, status:r.status, crit:r.crit, score:r.score, video_path:r.video_path,
      trick:ST.entries.find(e => e.id===r.entry_id)?.trick || null})).filter(e => e.trick);
  } else ents = ST.entries.filter(e => e.status==='reviewed' && e.reviewed_at && e.reviewed_at <= dl.toISOString());
  ST.sel = {frozen:true, ents, fromLog:!!log};
}
async function renderSelection(){
  const root = $('#page-selection');
  if (!isAdmin()){ root.innerHTML = '<div class="card"><div class="empty">Admins only.</div></div>'; return; }
  if (!HAS_SC){ root.innerHTML = `<div class="card"><h2>Selection</h2><div class="empty">The Snowboard ranking needs the Snowboard Skills-Check. It will be available as soon as the requirements are defined.</div></div>`; return; }
  if (!ST.sel || ST.sel.rev !== ST._rev){ root.innerHTML = '<div class="card"><div class="empty">Loading…</div></div>'; await loadSelectionSnapshot(); ST.sel.rev = ST._rev; }
  const F = ST.selF || (ST.selF = {level:'T4', sex:'W'});
  const dl = selectionDeadline(), frozen = ST.sel.frozen;
  const days = Math.ceil((dl.getTime() - Date.now()) / 86400000);
  const atts = ST.attempts.filter(a => !frozen || a.created_at <= dl.toISOString());
  const rows = ST.profiles.filter(p => p.role==='athlete' && p.level===F.level && p.gender===F.sex).map(a => {
    const ents = ST.sel.ents.filter(e => e.athlete_id===a.id && (e.status!=='reviewed' || e.video_path));   // Selektion: nur Bewertungen mit Video
    const t = levelTotals(a, a.level, ents), path = pathTotals(a, ents);   // path = alle Stufen, nur Info (zählt nicht für die Rangierung)

    return {a, t, path, vids, rated, n:my.length, stomp: my.length >= 5 ? Math.round(st / my.length * 100) : null};
  }).sort((x, y) => y.t.pct - x.t.pct || (y.stomp ?? -1) - (x.stomp ?? -1) || x.a.name.localeCompare(y.a.name));
  const dc = (t, d) => !t.by[d] ? '<td class="num">–</td>' : t.incl.includes(d) ? pdfPctCell(pct(t.by[d].pts, t.by[d].max), 70, 40) : '<td class="num"><span class="tiny muted">not in focus</span></td>';
  ST._selRows = rows;
  root.innerHTML = `
    <div class="sel-banner ${frozen ? 'frozen' : ''}">${frozen

      <select onchange="ST.selF.sex=this.value;renderSelection()">${opts([['W','Women'],['M','Men']], F.sex)}</select>

    <div class="card"><h2>Ranking ${F.level} ${F.sex==='W' ? 'Women' : 'Men'} <span class="muted" style="letter-spacing:0;font-weight:600">${rows.length}</span></h2>
      <ul class="hints"><li>Ranking by Skills-Check total, tie-break: stomp rate from sessions</li><li>Only tricks rated with video count</li><li>Stomp rate is shown from 5 attempts</li><li>«All levels» (T1–T4 together) is shown for information only and does not count for the ranking</li></ul>
      <div class="scroll-x"><table class="tbl sel-tbl"><thead><tr><th>#</th><th>Athlete</th><th class="num">Jumps</th><th class="num">Rails</th><th class="num">HP</th><th class="num">Total</th><th class="num">All levels</th><th class="num">Videos</th><th class="num">Stomp rate</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="click" onclick="ST.athleteId='${r.a.id}';ST.level=null;go('skills')"><td class="num"><b>${i + 1}</b></td><td><b>${esc(r.a.name)}</b><div class="tiny muted">${esc(groupName(r.a.group_id))}</div></td>${[dc(r.t,'Jump'), dc(r.t,'Rail'), dc(r.t,'Halfpipe'), pdfPctCell(r.t.pct, 70, 40)].map((h, k) => h.replace('<td class="num"', `<td class="num" data-l="${['Jumps','Rails','HP','Total'][k]}"`)).join('')}<td class="num" data-l="All levels"><b style="color:#396FA8">${r.path ? r.path.pct + '%' : '–'}</b>${r.path ? `<div class="tiny muted" style="line-height:1.35">T1 ${r.path.lv.T1}% · T2 ${r.path.lv.T2}%<br>T3 ${r.path.lv.T3}% · T4 ${r.path.lv.T4}%</div>` : ''}</td><td class="num" data-l="Videos">${r.vids}/${r.rated}</td><td class="num" data-l="Stomp rate">${r.stomp==null ? `<span class="tiny muted">${r.n} att.</span>` : r.stomp + '%'}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">No athletes.</td></tr>'}</tbody></table></div></div>

/* ── Video-Aufräumen (jährlich ab 31. Mai, nach Selektion und Rekursfrist):
   Videos von Tricks, die auf der aktuellen Stufe der Athlet:in nicht mehr explizit verlangt sind,
   werden gelöscht. Eintrag und Bewertung bleiben erhalten (auch im Verlauf). ── */
function cleanupDate(){ const d = selectionDeadline(); return new Date(Date.UTC(d.getUTCFullYear(), 4, 30, 22, 0, 0)); }   // 31.5. 00:00 Schweizer Zeit
// Upload-Zeitpunkt steht im Dateinamen: <athlet>/<eintrag>-<ms>.<ext>
const videoTs = p => +((/-(\d{12,})\.[a-z0-9]+$/i.exec(p || '') || [])[1] || 0);
function cleanupCandidates(onlyBefore){
  if (!HAS_SC) return [];   // ohne Skills-Check nie aufräumen (sonst wären alle Videos «nicht verlangt»)
  return ST.entries.filter(e => {
    if (!e.video_path) return false;
    if (onlyBefore && !(videoTs(e.video_path) && videoTs(e.video_path) < onlyBefore)) return false;   // nur Videos von vor dem 31. Mai
    const a = prof(e.athlete_id); if (!a?.level || !a.gender) return false;
    return !directMatches(e.discipline, a.gender, e.trick).some(x => x.level === a.level);
  });
}
function cleanupCard(){
  const due = Date.now() >= cleanupDate().getTime(), list = cleanupCandidates();
  const byAth = {}; list.forEach(e => (byAth[e.athlete_id] ||= []).push(e));
  return `<div class="card"><h2>Video clean-up <span class="muted" style="letter-spacing:0;font-weight:600">${list.length}</span></h2>
    <ul class="hints"><li>Runs automatically every year from 31 May (after selection and appeal period), only for videos uploaded before 31 May</li><li>Deletes videos of tricks that are no longer required at the athlete's current level</li><li>Entry and rating stay, only the video is removed</li><li>Set the new levels in the Team tab first</li></ul>
    ${list.length ? `<details><summary>Show videos (${list.length})</summary><ul class="small">${Object.entries(byAth).map(([id, l]) => `<li><b>${esc(prof(id)?.name)}</b> (${prof(id)?.level}): ${l.map(e => esc(e.label)).join(', ')}</li>`).join('')}</ul></details>` : '<div class="empty">No videos to clean up.</div>'}
    <div class="btnrow">${due
      ? `<button class="btn red" ${list.length ? '' : 'disabled'} onclick="runVideoCleanup()">Delete ${list.length} videos</button>`
      : `<span class="tiny muted">Available from ${fmtDate(cleanupDate().toISOString())}</span>`}</div></div>`;
}
// Automatisch: ab 31. Mai bis Ende Juli bei jedem App-Start von DVLP/Admin (ohne Rückfrage).
// Gelöscht werden nur Videos, die vor dem 31. Mai hochgeladen wurden: neue Uploads bleiben.
// Altes Video nach dem Ersetzen: sofort löschen, wenn damit nie bewertet wurde.
// Wurde damit bewertet, bleibt es als Nachweis (Selektion, Rekurs) und wird beim Aufräumen ab 31. Mai entfernt.
async function dropOldVideo(entryId, oldPath){
  if (!oldPath || DEMO) return;
  try {
    const log = await Store.entryLog({entryId});
    if (log === null) return;   // Verlauf nicht verfügbar: sicherheitshalber behalten
    if (!log.some(r => r.video_path === oldPath && r.status === 'reviewed')) await Store.removeVideos([oldPath]);
  } catch (e){ console.warn('old video', e); }
}
async function autoVideoCleanup(){
  if (DEMO || !ST.me || ST.me.role !== 'dvlp') return;
  const cd = cleanupDate().getTime(), now = Date.now(), end = Date.UTC(new Date(cd).getUTCFullYear(), 7, 1);
  if (now < cd || now >= end) return;
  // höchstens einmal pro Tag und Gerät
  const key = 'nw-cleanup-' + new Date().toISOString().slice(0, 10);
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch {}
  // ersetzte Videos (alte Versionen aus dem Verlauf), die vor dem 31. Mai hochgeladen wurden
  try {
    const log = await Store.entryLog({until:new Date(cd).toISOString()});
    const cur = new Map(ST.entries.map(e => [e.id, e.video_path]));
    const old = [...new Set((log || []).filter(r => cur.has(r.entry_id) && r.video_path && r.video_path !== cur.get(r.entry_id) && videoTs(r.video_path) && videoTs(r.video_path) < cd).map(r => r.video_path))];
    if (old.length) await Store.removeVideos(old);
  } catch (err){ console.warn('old versions clean-up', err); }
  const list = cleanupCandidates(cd);
  if (!list.length) return;
  try {
    await Store.removeVideos(list.map(e => e.video_path));
    for (const e of list) upsertLocal(await Store.saveEntry(ST.me, {...e, video_path:null}));
    if (isAdmin()) toast(`${list.length} videos deleted`);
  } catch (err){ console.warn('auto clean-up', err); }
}
async function runVideoCleanup(){
  const list = cleanupCandidates();
  if (!list.length || !confirm(`Delete ${list.length} videos permanently? Entries and ratings stay.`)) return;
  try {
    await Store.removeVideos(list.map(e => e.video_path));
    for (const e of list) upsertLocal(await Store.saveEntry(ST.me, {...e, video_path:null}));
    toast(`${list.length} videos deleted`); ST.sel = null; renderSelection();
  } catch (err){ console.error(err); toast('Could not delete: ' + (err.message || err), true); }
}

/* ══════════════════════════════════════════════════════════════════════
   GEMEINSAMES FÜR SESSION / REPORTS / MONITORING
   Qualität eines Versuchs = erfüllte Kriterien / max (in %), Sturz = 0 %.
   Status wie Freeski-Monitoring: ≥70 Ready · 50–69 Building · <50 Critical · <5 Versuche Low data
   ══════════════════════════════════════════════════════════════════════ */
const SESS_TYPES = [['Landing Bag','Jump'], ['Big Air Training','Jump'], ['Big Air Competition','Jump'], ['Slopestyle Training','Jump'], ['Slopestyle Competition','Jump'], ['Halfpipe Training','Halfpipe'], ['Halfpipe Competition','Halfpipe']];
const LEGACY_TYPES = {'Jump Training':'Big Air Training', 'Rail Training':'Slopestyle Training', 'Competition':'Big Air Competition'};   // frühere Youth-Typen
const normType = t => LEGACY_TYPES[t] || t;
const typeDisc = t => (SESS_TYPES.find(x => x[0]===normType(t)) || [])[1] || 'Jump';
const isComp = t => /Competition/.test(normType(t));
const isRunType = t => /^(Slopestyle|Halfpipe)/.test(normType(t));
const todayIso = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const qa = a => a.fell ? 0 : !a.crit && a.outcome ? (a.outcome==='stomped' ? 100 : 60) : Math.round((a.score||0) / (a.max || maxFor(a.discipline)) * 100);   // Run-Elemente ohne Kriterien: ✓ = 60 %, ★ = 100 %
const avg = arr => arr.length ? Math.round(arr.reduce((s, x) => s + x, 0) / arr.length) : null;
const landedPct = list => list.length ? Math.round(list.filter(a => !a.fell).length / list.length * 100) : null;
const qChip = v => v==null ? '<span class="chip">–</span>' : `<span class="chip ${v>=70?'green':v>=50?'gold':'red'}">${v}%</span>`;
const fmtShort = iso => iso ? new Date(iso).toLocaleDateString('de-CH', {day:'2-digit', month:'2-digit'}) : '';
const sessById = id => ST.sessions.find(s => s.id===id);
const sessDate = a => sessById(a.session_id)?.date || a.created_at.slice(0,10);
const sessAttempts = id => ST.attempts.filter(a => a.session_id===id);
function activeSession(){ return ST.sessions.find(s => !s.ended_at && s.created_by===ST.me.id) || null; }
function upsertIn(list, row){ const i = list.findIndex(x => x.id===row.id); if (i >= 0) list[i] = row; else list.unshift(row); }
function statusOf(n, v){
  if (n < 5) return {k:'low', label:'Low data', cls:''};
  if (v >= 70) return {k:'ready', label:'Ready', cls:'green'};
  if (v >= 50) return {k:'building', label:'Building', cls:'gold'};
  return {k:'critical', label:'Critical', cls:'red'};
}
const statusChipOf = (n, v) => { const s = statusOf(n, v); return `<span class="chip ${s.cls}">${s.label}</span>`; };
// Kern-Trick ohne Grab (Grab-Varianten werden im Monitoring zusammengefasst)
function coreOf(a){
  const label = a.discipline==='Rail' ? a.label : trickLabel(a.discipline, {...a.trick, grab:''});
  return {key:`${a.discipline}|${label}`, label};
}
// Ø der letzten 3 Sessions (Basis für den Status)
function recentAvg(list, nSess=3){
  const ids = [...new Set(list.map(a => a.session_id))].sort((x, y) => (sessById(x)?.date||'').localeCompare(sessById(y)?.date||''));
  const keep = new Set(ids.slice(-nSess));
  return avg(list.filter(a => keep.has(a.session_id)).map(qa));
}
function critRates(list, disc){
  return critSetFor(disc).map(c => ({k:c.k, name:c.name, pct: list.length ? Math.round(list.filter(a => !a.fell && a.crit?.[c.k]).length / list.length * 100) : null}));
}
const CRIT_COLORS = ['#396FA8','#8E5BB8','#C96A1F','#1F9E93','#B08D1E'];
const PERIODS = [['season','Season'], ['30','Last 30 days'], ['all','All time']];
function periodStart(p){
  if (p==='all') return '';
  if (p==='30') return new Date(Date.now() - 30*86400000).toISOString().slice(0,10);
  const d = new Date(); const y = d.getMonth() >= 4 ? d.getFullYear() : d.getFullYear() - 1;   // Saison 1. Mai – 30. April
  return `${y}-05-01`;
}
const visGroupAthleteIds = () => new Set(visibleAthletes().map(a => a.id));

/* ── Diagramme: SVG in der tatsächlichen Containerbreite, alle mit Achsenbeschriftung ── */
const CHARTS = [];
function chartSlot(draw){ const id = 'ch' + CHARTS.length + '-' + Math.random().toString(36).slice(2,6); CHARTS.push({id, draw}); return `<div class="chart" id="${id}"></div>`; }
function drawCharts(){ for (const c of CHARTS){ const el = document.getElementById(c.id); if (el) el.innerHTML = c.draw(Math.max(el.clientWidth, 280)); } }
let _rsT; window.addEventListener('resize', () => { clearTimeout(_rsT); _rsT = setTimeout(drawCharts, 150); });
// yMax: Achse in Punkten 0…yMax (Kriterien) statt 0–100 %
function axes(W, H, pad, yTitle, xTitle, yMax){
  const ih = H - pad.t - pad.b; let s = '';
  const ticks = yMax ? Array.from({length:yMax + 1}, (_, k) => [k / yMax * 100, String(k)]) : [0, 25, 50, 75, 100].map(t => [t, t + '%']);
  for (const [t, lbl] of ticks){
    const y = pad.t + ih * (1 - t/100);
    s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="${t===0?'#bdb6b3':'#ece8e6'}"/><text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end" font-size="11" fill="#6b6b70">${lbl}</text>`;
  }
  s += `<text transform="translate(13 ${pad.t + ih/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#6b6b70">${esc(yTitle)}</text>`;
  s += `<text x="${pad.l + (W - pad.l - pad.r)/2}" y="${H - 5}" text-anchor="middle" font-size="11" fill="#6b6b70">${esc(xTitle)}</text>`;
  return s;
}
// bars: [{v (0–100), label, top, red, title}] · o.line: laufender Durchschnitt
function barChart(bars, o={}){
  return chartSlot(W0 => {
    const H = o.h || 200, pad = {l:46, r:12, t:20, b:42};
    const n = Math.max(bars.length, 1);
    const slotW = Math.max(14, Math.min(64, (W0 - pad.l - pad.r) / n));
    const W = Math.max(W0, pad.l + pad.r + slotW * n);
    const ih = H - pad.t - pad.b, y = v => pad.t + ih * (1 - v/100);
    const bw = Math.min(slotW * 0.68, 34), every = slotW < 26 ? Math.ceil(26 / slotW) : 1;
    const x0 = pad.l + Math.max(0, (W - pad.l - pad.r - slotW * n) / 2);
    let s = axes(W, H, pad, o.yTitle || 'Quality', o.xTitle || 'Attempts', o.yMax);
    const run = []; let sum = 0;
    bars.forEach((b, i) => {
      const x = x0 + i * slotW + (slotW - bw)/2, v = Math.max(0, Math.min(100, b.v||0));
      const col = b.col ? b.col : b.red ? '#D64545' : v >= 70 ? '#3E8E5A' : v >= 50 ? '#B08D1E' : '#D64545';
      s += `<g><title>${esc(b.title || '')}</title>`;
      if (b.red) s += `<text x="${x + bw/2}" y="${y(0) - 5}" text-anchor="middle" font-size="13" font-weight="800" fill="#D64545">✗</text>`;
      else s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(ih * v/100, 2)}" rx="3" fill="${col}" opacity="${b.fade?0.55:1}"/>`;
      if (b.top != null) s += `<text x="${x + bw/2}" y="${(b.red ? y(0) - 20 : y(v) - 5)}" text-anchor="middle" font-size="10.5" fill="#3E3E3F">${esc(b.top)}</text>`;
      if (b.label && i % every === 0) s += `<text x="${x + bw/2}" y="${H - pad.b + 15}" text-anchor="middle" font-size="10.5" fill="#6b6b70">${esc(b.label)}</text>`;
      s += '</g>';
      sum += v; run.push([x + bw/2, y(sum / (i + 1))]);
    });
    if (o.line && run.length > 1) s += `<polyline fill="none" stroke="#3E3E3F" stroke-width="2" stroke-dasharray="4 3" points="${run.map(p => p.join(',')).join(' ')}"/>`;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
  });
}
// series: [{name, color, values:[v|null]}]
function lineChart(series, xlabels, o={}){
  const legend = `<div class="legend" style="margin-top:6px">${series.map(se => `<span><i class="dot" style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`;
  return chartSlot(W0 => {
    const H = o.h || 210, pad = {l:46, r:16, t:14, b:42};
    const n = xlabels.length, step = Math.max(34, (W0 - pad.l - pad.r - 24) / Math.max(n - 1, 1));
    const W = Math.max(W0, pad.l + pad.r + 24 + step * (n - 1));
    const ih = H - pad.t - pad.b, y = v => pad.t + ih * (1 - v/100);
    const x = i => n === 1 ? pad.l + (W - pad.l - pad.r)/2 : pad.l + 12 + i * step;
    let s = axes(W, H, pad, o.yTitle || 'Criteria achieved', o.xTitle || 'Sessions');
    xlabels.forEach((l, i) => s += `<text x="${x(i)}" y="${H - pad.b + 15}" text-anchor="middle" font-size="10.5" fill="#6b6b70">${esc(l)}</text>`);
    series.forEach((se, si) => {
      const off = (si - (series.length - 1)/2) * 2.5;
      const pts = se.values.map((v, i) => v == null ? null : [x(i) + off, y(v), v]).filter(Boolean);
      if (pts.length > 1) s += `<polyline fill="none" stroke="${se.color}" stroke-width="2" points="${pts.map(p => p[0]+','+p[1]).join(' ')}"/>`;
      s += pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${se.color}"><title>${esc(se.name)}: ${p[2]}%</title></circle>`).join('');
    });
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${s}</svg>`;
  }) + legend;
}

/* ══════════════════════════════════════════════════════════════════════
   SESSION: Live-Erfassung im Training (Coach / DVLP)
   Jeder Versuch wird sofort gespeichert; die laufende Session liegt in der
   DB (ended_at leer) und wird nach Reload / auf anderem Gerät fortgesetzt.
   ══════════════════════════════════════════════════════════════════════ */
const sxFresh = (o={}) => ({setup:null, athleteId:null, pick:null, crit:null, form:null, cands:[], editAth:false, mode:null, fails:new Set(), comment:'', reasons:[], grab:'', runs:{}, runNote:null, runDetail:null, ...o});
let SX = sxFresh();
// Bewertung wie Snowboard: FAILED (Gründe, Mehrfachauswahl) oder LANDED (erfüllte Kriterien als ⭐; alle = Stomped).
// Fail-Gründe werden wie im Snowboard als «Tags: …» vorne in der Notiz gespeichert.
const FAIL_REASONS = ['Timing rotation','Position Take-off','Spin power','Air Position','Timing Grab','Spotting'];
const parseTags = note => { const m = /^Tags: ([^|]*)/.exec(note || ''); return m ? m[1].split(',').map(x => x.trim()).filter(Boolean) : []; };
const noteText = note => (note || '').replace(/^Tags: [^|]*(\|\s*)?/, '').trim();
const outcomeOf = a => a.fell ? 'failed' : a.outcome && !a.crit ? a.outcome : a.score === (a.max || maxFor(a.discipline)) ? 'stomped' : 'landed';
function failReasonList(){
  const custom = new Set();
  ST.attempts.forEach(a => parseTags(a.note).forEach(t => { if (!FAIL_REASONS.includes(t)) custom.add(t); }));
  SX.fails.forEach(t => { if (!FAIL_REASONS.includes(t)) custom.add(t); });
  return [...FAIL_REASONS, ...[...custom].sort()];
}
function sxMode(m){ SX.mode = SX.mode===m ? null : m; SX.fails = new Set(); SX.crit = null; renderSession(); }
function sxCrit(k){ SX.crit[k] = !SX.crit[k]; renderSession(); }
function sxFail(i){ const r = SX.reasons[i]; SX.fails.has(r) ? SX.fails.delete(r) : SX.fails.add(r); renderSession(); }
function sxFailOther(){ const r = (prompt('New fail reason:') || '').trim(); if (r){ SX.fails.add(r); renderSession(); } }

function saveSX(sessId){

}
function restoreSX(){

  try { const d = JSON.parse(localStorage.getItem(SX_KEY) || 'null'); if (d && d.sessId===s.id) SX = sxFresh({...d.sx, fails:new Set(d.sx.fails || [])}); } catch {}

// Kandidaten wie Freeski: Kern-Trick (ohne Grab) aus Session + Assessment; Grab wird pro Versuch gewählt
function sxCandidates(s, atts){
  const cands = [], seen = new Set();
  const push = (src, disc, trick) => {
    const core = disc==='Rail' || trick?.kind==='basic' ? {...trick} : {...trick, grab:''};
    const label = trickLabel(disc, core), k = disc + '|' + label;
    if (seen.has(k)) return; seen.add(k); cands.push({src, disc, trick:core, label, key:k});
  };
  atts.filter(a => a.athlete_id===SX.athleteId && !a.run_no).forEach(a => push('session', a.discipline, a.trick));
  const d0 = typeDisc(s.type);
  entriesOf(SX.athleteId).sort((a,b) => (a.discipline===d0 ? 0 : 1) - (b.discipline===d0 ? 0 : 1) || (+(b.trick?.rot)||0) - (+(a.trick?.rot)||0))
    .forEach(e => push(e.status==='goal' ? 'goal' : 'assessment', e.discipline, e.trick));
  return cands;
}
const hasGrab = pk => pk && pk.disc!=='Rail' && pk.trick?.kind!=='basic';
// Grabs, die zu diesem Kern-Trick passen: aus dem Assessment (Goals markiert) + bereits geloggt
function sxGrabOptions(pk){
  const m = new Map();
  entriesOf(SX.athleteId).forEach(e => { if (e.discipline===pk.disc && e.trick?.grab && trickLabel(e.discipline, {...e.trick, grab:''})===pk.label) m.set(e.trick.grab, m.get(e.trick.grab)==='assessment' ? 'assessment' : (e.status==='goal' ? 'goal' : 'assessment')); });
  ST.attempts.forEach(a => { if (a.athlete_id===SX.athleteId && a.discipline===pk.disc && a.trick?.grab && coreOf(a).label===pk.label && !m.has(a.trick.grab)) m.set(a.trick.grab, 'session'); });
  if (SX.grab && !m.has(SX.grab)) m.set(SX.grab, 'session');
  return [...m.entries()];
}
function sxGrabTap(g){
  // wie Freeski: zweiter Grab-Tipp = Doppelgrab «A to B»; nochmals tippen = zurück
  if (!g) SX.grab = '';
  else if (SX.grab===g) SX.grab = '';
  else if (SX.grab && !SX.grab.includes(' to ')) SX.grab = `${SX.grab} to ${g}`;
  else SX.grab = g;
  renderSession();
}
function sxGrabOther(v){ if (v) { SX.grab = v; renderSession(); } }
const pickedTrick = () => ({...SX.pick.trick, ...(hasGrab(SX.pick) ? {grab:SX.grab || ''} : {})});

let _ac;
function logSound(){ // kurzer Blip wie in der Freeski-App
  try {
    _ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = 'sine'; o.frequency.value = 520;
    g.gain.setValueAtTime(.15, _ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, _ac.currentTime + .18);
    o.connect(g).connect(_ac.destination); o.start(); o.stop(_ac.currentTime + .2);
  } catch {}
}

// Session-Log: Elemente eines Runs als eigener Block, in Fahrreihenfolge
function logGroupsHtml(list){
  const items = [];
  list.forEach(a => { const l = items[items.length - 1]; if (a.run_no && l && l.run===a.run_no) l.atts.push(a); else items.push({run:a.run_no || null, atts:[a]}); });
  return items.map(it => {
    if (!it.run) return attemptRow(it.atts[0], {noName:true});
    const rows = it.atts.slice().sort((a, b) => a.created_at.localeCompare(b.created_at));
    const nL = rows.filter(a => !a.fell).length;
    return `<div class="run-group" style="border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px">
      <div class="row" style="gap:8px;margin-bottom:4px"><span class="chip dark">Run ${it.run}</span><span class="muted small">${nL}/${rows.length} landed</span><span class="grow"></span><span class="muted small">${new Date(rows[0].created_at).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'})}</span></div>
      ${rows.map(a => attemptRow(a, {noName:true})).join('')}</div>`;
  }).join('');
}
function sxAth(id){ SX.athleteId = id; SX.pick = null; SX.crit = null; SX.form = null; SX.mode = null; SX.fails = new Set(); SX.grab = ''; renderSession(); }
function sxPick(i){
  SX.pick = {...SX.cands[i]}; SX.crit = null; SX.form = null; SX.mode = null; SX.fails = new Set();
  // Grab vorauswählen: zuletzt geloggter bzw. erster aus dem Assessment
  const last = sessAttempts(activeSession().id).filter(a => a.athlete_id===SX.athleteId && coreOf(a).label===SX.pick.label).sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
  SX.grab = last?.trick?.grab ?? (sxGrabOptions(SX.pick)[0]?.[0] || '');
  renderSession();
}

// ── Run-Builder (Slopestyle / Halfpipe) wie Freeski: Run zusammenstellen, jedes Element ✗ / ✓ / ★
const RAIL_TYPES = ['Box','Tube','Rail','Down Tube','Down Rail','Single Kink','Double Kink','Cannon','Gap to Rail','DFD','Flat-Down','Waterfall','Ellbow','S-Rail','C-Rail','Pole-Jam'];
const runKey = () => `nw-run-${activeSession()?.id}-${SX.athleteId}`;
function runState(){
  SX.runs ||= {};
  const k = runKey();
  if (!SX.runs[k]){ let r = null; try { r = JSON.parse(localStorage.getItem(k)); } catch {} SX.runs[k] = r || {n:1, els:[], rail:{type:'Rail', text:''}}; }
  return SX.runs[k];
}
function runSave(){ try { localStorage.setItem(runKey(), JSON.stringify(runState())); } catch {} }
const runMax = s => typeDisc(s.type)==='Halfpipe' ? 10 : 8;
function runAddPicked(){
  const s = activeSession(), r = runState();
  if (r.els.length >= runMax(s)){ toast(`Max. ${runMax(s)} elements per run`, true); return; }
  const t = pickedTrick();
  r.els.push({disc:SX.pick.disc, trick:t, label:trickLabel(SX.pick.disc, t), rate:null, tags:[], note:''});
  runSave(); renderSession();
}
function runAddRail(){
  const s = activeSession(), r = runState(), txt = (document.getElementById('run-rail-text')?.value || '').trim();
  if (!txt){ toast('Enter the rail trick', true); return; }
  if (r.els.length >= runMax(s)){ toast(`Max. ${runMax(s)} elements per run`, true); return; }
  r.els.push({disc:'Rail', trick:{railType:r.rail.type, text:txt, free:true}, label:`Rail ${r.rail.type}: ${txt}`, rate:null, tags:[], note:''});
  r.rail.text = ''; runSave(); renderSession();
}
// Wie im normalen Log: ✓ öffnet die Kriterien-Sterne (alle = automatisch Stomped), ★ setzt alle, ✗ öffnet die Fail-Gründe
function runRate(i, v){
  const e = runState().els[i], set = critSetFor(e.disc), prev = e.rate;
  if (prev===v){ e.rate = null; e.crit = null; e.tags = []; SX.runDetail = null; }
  else {
    e.rate = v;
    if (v==='failed') e.crit = null;
    else { e.tags = []; if (v==='stomped' || prev!=='landed' || !e.crit) e.crit = Object.fromEntries(set.map(c => [c.k, v==='stomped'])); }
    SX.runDetail = i; SX.runNote = null;
  }
  runSave(); renderSession();
}
function runCrit(i, k){
  const e = runState().els[i];
  e.crit ||= Object.fromEntries(critSetFor(e.disc).map(c => [c.k, false]));
  e.crit[k] = !e.crit[k];
  e.rate = Object.values(e.crit).every(Boolean) ? 'stomped' : 'landed';
  runSave(); renderSession();
}
function runOpenDetail(i){ SX.runDetail = SX.runDetail===i ? null : i; SX.runNote = null; renderSession(); }
function runFailOther(i){ const t = (prompt('New fail reason:') || '').trim(); if (!t) return; const e = runState().els[i]; if (!e.tags.includes(t)) e.tags = [...e.tags, t]; runSave(); renderSession(); }
function runRemove(i){ runState().els.splice(i, 1); runSave(); renderSession(); }
function runToggleTag(i, t){ const e = runState().els[i]; e.tags = e.tags.includes(t) ? e.tags.filter(x => x!==t) : [...e.tags, t]; runSave(); renderSession(); }
function runOpenNote(i){ SX.runNote = SX.runNote===i ? null : i; SX.runDetail = null; renderSession(); }
// ✎ im Run: Element bearbeiten (Trick, Grab bzw. Rail-Art + Text, Notiz, Position)
function runMove(i, dir){
  const r = runState(), j = i + dir;
  if (j < 0 || j >= r.els.length) return;
  [r.els[i], r.els[j]] = [r.els[j], r.els[i]];
  SX.runNote = j; SX.runDetail = null; runSave(); renderSession();
}
function runEditApply(i){
  const e = runState().els[i];
  if (e.disc==='Rail' && e.trick?.free){
    const txt = (document.getElementById('run-edit-text')?.value || '').trim();
    if (!txt){ toast('Enter the rail trick', true); return; }
    const type = document.getElementById('run-edit-type')?.value || e.trick.railType;
    e.trick = {...e.trick, railType:type, text:txt}; e.label = `Rail ${type}: ${txt}`;
  } else {
    const ci = document.getElementById('run-edit-trick')?.value;
    const c = ci !== '' && ci != null ? SX.cands[+ci] : null;
    const grab = document.getElementById('run-edit-grab')?.value ?? e.trick.grab ?? '';
    const disc = c ? c.disc : e.disc, base = c ? c.trick : e.trick;
    const t = hasGrab({disc, trick:base}) ? {...base, grab} : {...base};
    if (disc !== e.disc && e.crit) e.crit = Object.fromEntries(critSetFor(disc).map(k => [k.k, e.rate==='stomped']));
    e.disc = disc; e.trick = t; e.label = trickLabel(disc, t);
  }
  SX.runNote = null; runSave(); renderSession();
}

async function runSaveAll(){
  const s = activeSession(), r = runState(), N = r.els.length;
  try {
    for (const [i, e] of r.els.entries()){
      const fell = e.rate==='failed', set = critSetFor(e.disc);
      const crit = Object.fromEntries(set.map(c => [c.k, !fell && !!e.crit?.[c.k]]));
      const score = Object.values(crit).filter(Boolean).length;
      const note = [fell && e.tags.length ? 'Tags: ' + e.tags.join(', ') : '', `Run ${r.n} · ${i + 1}/${N}`, e.note].filter(Boolean).join(' | ');
      const a = {id:uid(), session_id:s.id, athlete_id:SX.athleteId, discipline:e.disc, trick:e.trick, label:e.label, crit, score,
        max:set.length, fell, outcome: fell ? 'failed' : score===set.length ? 'stomped' : 'landed', run_no:r.n, note, entry_id:null, created_at:new Date(Date.now() + i).toISOString(), created_by:ST.me.id};
      upsertIn(ST.attempts, await Store.saveAttempt(ST.me, a));
    }
    logSound(); toast(`Run #${r.n} saved`);
    r.n++; r.els.forEach(e => { e.rate = null; e.crit = null; e.tags = []; e.note = ''; }); SX.runDetail = null;   // Layout bleibt für den nächsten Run
    runSave(); renderSession();
  } catch (err){ console.error(err); toast('Could not save run: ' + (err.message||err), true); }
}

async function logAttempt(fell){
  const s = activeSession(), pk = SX.pick, set = critSetFor(pk.disc);
  const crit = fell ? Object.fromEntries(set.map(c => [c.k, false])) : {...SX.crit};
  const fails = fell ? [...SX.fails] : [];
  const note = [fails.length ? 'Tags: ' + fails.join(', ') : '', (SX.comment || '').trim()].filter(Boolean).join(' | ') || null;
  const t = pickedTrick();
  const score = fell ? 0 : Object.values(crit).filter(Boolean).length;
  const a = {id:uid(), session_id:s.id, athlete_id:SX.athleteId, discipline:pk.disc, trick:t, label:trickLabel(pk.disc, t), crit,
    score, max:set.length, fell, outcome: fell ? 'failed' : score===set.length ? 'stomped' : 'landed', note, entry_id:null, created_at:nowIso(), created_by:ST.me.id};
  try {
    upsertIn(ST.attempts, await Store.saveAttempt(ST.me, a));
    SX.crit = null; SX.mode = null; SX.fails = new Set(); SX.comment = '';
    logSound();
    const o = outcomeOf(a);
    toast(o==='failed' ? 'Failed logged' : o==='stomped' ? '⭐ Stomped!' : `Landed ${a.score}/${a.max}`); renderSession();
  } catch (err){ console.error(err); toast('Could not save attempt: ' + (err.message||err), true); }
}

function eliteRating(a){
  const r = a.ext_rating; if (!r || a.fell) return '';
  const K = {Takeoff:'Take-Off', Trick:'Trick', Grab:'Grab', Landing:'Landing', Amplitude:'Amplitude'};
  let parts = [...String(r.kommentar||'').matchAll(/(Takeoff|Trick|Grab|Landing|Amplitude):(\w+)/g)].map(([, c, v]) => `${K[c]} ${v}`);
  if (!parts.length && r.kpis) parts = [['axis','Take-Off'],['control','Control'],['grab','Grab'],['quality_landing','Quality Landing'],['amplitude','Amplitude']].filter(([k]) => k in r.kpis).map(([k, l]) => `${l} ${r.kpis[k] ? '✓' : '✗'}`);
  if (!parts.length && r.gesamt) parts = [r.gesamt >= 10 ? 'perfect' : r.gesamt >= 7 ? 'okay' : 'miss'];
  return parts.length ? `<div class="tiny muted" style="margin-top:6px"><b>Rated in the Elite app:</b> ${esc(parts.join(' · '))}</div>` : '';
}

let EA = null;
function editAttempt(id){
  const a = ST.attempts.find(x => x.id===id); if (!a) return;
  const set = critSetFor(a.discipline);
  EA = {id, oc:outcomeOf(a), crit: a.crit ? {...a.crit} : Object.fromEntries(set.map(c => [c.k, false])), hasCrit: !!a.crit,
    fails:new Set(parseTags(a.note)), comment:noteText(a.note), grab:a.trick?.grab || ''};
  renderEditAttempt();
}
function renderEditAttempt(){
  const a = ST.attempts.find(x => x.id===EA.id), set = critSetFor(a.discipline), score = Object.values(EA.crit).filter(Boolean).length;
  const grabbable = a.discipline!=='Rail' && a.trick?.kind!=='basic';

      ${EA.hasCrit ? '' : `<button class="bigbtn land ${EA.oc==='stomped'?'on':''}" style="border-color:var(--cyan);color:var(--cyan)" onclick="EA.oc='stomped';renderEditAttempt()">★<br>STOMPED</button>`}
    </div>
    ${EA.oc!=='failed' && EA.hasCrit ? `<div class="disclose"><div class="row"><b style="color:var(--char)">Criteria met</b><span class="grow"></span><b>${score}/${set.length}</b></div>
      <div class="critstars">${set.map(c => `<button class="critstar ${EA.crit[c.k]?'on':''}" onclick="EA.crit['${c.k}']=!EA.crit['${c.k}'];renderEditAttempt()"><span class="st">⭐</span><span class="nm">${esc(c.name)}</span></button>`).join('')}</div></div>` : ''}
    ${EA.oc==='failed' ? `<div class="disclose"><b style="color:var(--char)">Reason(s)</b><div class="failchips">${reasons.map(r => `<button class="failchip ${EA.fails.has(r)?'on':''}" onclick="EA.fails.has(${esc(JSON.stringify(r))})?EA.fails.delete(${esc(JSON.stringify(r))}):EA.fails.add(${esc(JSON.stringify(r))});renderEditAttempt()">${esc(r)}</button>`).join('')}</div></div>` : ''}

}
async function saveEditAttempt(){
  const a = ST.attempts.find(x => x.id===EA.id), set = critSetFor(a.discipline);
  const fell = EA.oc==='failed';
  const trick = a.discipline!=='Rail' && a.trick?.kind!=='basic' ? {...a.trick, grab:EA.grab} : a.trick;
  const note = [fell && EA.fails.size ? 'Tags: ' + [...EA.fails].join(', ') : '', (EA.comment || '').trim()].filter(Boolean).join(' | ') || null;
  const next = {...a, trick, label: trick===a.trick ? a.label : trickLabel(a.discipline, trick), fell, note};
  if (EA.hasCrit){
    next.crit = fell ? Object.fromEntries(set.map(c => [c.k, false])) : {...EA.crit};
    next.score = fell ? 0 : Object.values(next.crit).filter(Boolean).length;
    next.outcome = fell ? 'failed' : next.score===set.length ? 'stomped' : 'landed';
  } else next.outcome = EA.oc;
  try { upsertIn(ST.attempts, await Store.saveAttempt(ST.me, next)); closeModal(); toast('Attempt updated'); render(); }
  catch (err){ toast('Could not save: ' + (err.message||err), true); }
}
async function deleteAttempt(id){
  if (!confirm('Delete this attempt?')) return;
  try { await Store.deleteAttempt(id); ST.attempts = ST.attempts.filter(a => a.id!==id); toast('Attempt deleted'); render(); }
  catch (err){ toast('Could not delete: ' + (err.message||err), true); }
}

async function endSession(){

    }
    const notes = {}, results = {};

/* ══════════════════════════════════════════════════════════════════════
   MONITORING: aufgebaut wie im Snowboard: Team → Athlet:in → Trick
   Hauptmetrik Stomp-Rate (alle Kriterien erfüllt), dazu Landed-Rate,
   Kriterien-Erfüllung, Fail-Gründe, Verlauf über Sessions, Coaching Analysis.
   ══════════════════════════════════════════════════════════════════════ */
const MON_ST = {ready:{c:'#3E8E5A', l:'Ready'}, building:{c:'#C96A1F', l:'Building'}, critical:{c:'#D64545', l:'Critical'}, lowdata:{c:'#8a8a8f', l:'Low data'}};
// Stomped = bestes Ergebnis → Grün; Landed → Türkis; Failed → Rot
const OC = {stomped:'#3E8E5A', landed:'#148FA0', failed:'#D64545', volume:'#396FA8', good:'#3E8E5A'};
const MON_DIR_COL = {'Left':'#148FA0', 'Right':'#396FA8', 'Switch Left':'#8E5BB8', 'Switch Right':'#C96A1F', 'Frontside':'#148FA0', 'Backside':'#396FA8', 'Switch Frontside':'#8E5BB8', 'Switch Backside':'#C96A1F', 'Forward':'#1F9E93', 'Switch':'#B08D1E', 'Rails':'#3E3E3F', 'Basics':'#6b6b70', 'Other':'#8a8a8f'};
const MON_DIR_ORDER = ['Left','Right','Switch Left','Switch Right','Forward','Switch','Rails','Basics','Other'];
const MON_PLATEAU_TOL = 5;
const monStatus = (n, s) => n < 5 ? 'lowdata' : s / n >= .7 ? 'ready' : s / n >= .4 ? 'building' : 'critical';
// Quelle im Monitoring: Youth- und Elite-Daten werden NIE vermischt (Emilie). Elite wird gerechnet wie in der Elite-App.
const monSrc = () => ST.mon.src === 'elite' ? 'elite' : 'youth';
const monQoeMode = () => monSrc()==='elite' && !SB;   // Freeski Elite: Status nach Ø QoE (≥70 / 50–69 / <50)
function eliteQoe(a){
  const r = a.ext_rating || {}, S = {miss:0, okay:50, perfect:100};
  const v = [...String(r.kommentar||'').matchAll(/(Takeoff|Grab|Trick|Landing):(\w+)/g)].map(m => S[m[2]]).filter(x => x !== undefined);
  if (v.length) return Math.round(v.reduce((x, y) => x + y, 0) / v.length);
  return r.gesamt == null ? null : r.gesamt >= 10 ? 100 : r.gesamt >= 7 ? 50 : 0;
}
// Kennzahl und Status einer Liste von Versuchen: Stomp-Rate (Youth, Snowboard Elite) oder Ø QoE (Freeski Elite)
function monMetric(list){
  const c = monCounts(list);
  if (monQoeMode()){
    const q = list.map(eliteQoe).filter(x => x != null), v = q.length ? Math.round(q.reduce((x, y) => x + y, 0) / q.length) : 0;
    return {v, c, st: c.n < 5 ? 'lowdata' : v >= 70 ? 'ready' : v >= 50 ? 'building' : 'critical', lbl:'Ø QoE'};
  }
  return {v: pctR(c.s, c.n), c, st: monStatus(c.n, c.s), lbl:'stomp rate'};
}
const monStatusKey = () => monQoeMode()
  ? ['Trick status (Ø QoE, as in the Elite app)', [['ready','≥ 70%'],['building','50–69%'],['critical','< 50%'],['lowdata','< 5 attempts']]]
  : ['Trick status (stomp rate)', [['ready','≥ 70%'],['building','40–69%'],['critical','< 40%'],['lowdata','< 5 attempts']]];
const hasEliteFor = id => ST.attempts.some(a => a.athlete_id===id && isElite(sessById(a.session_id)));
const monCounts = list => { const c = {n:list.length, s:0, l:0, f:0}; list.forEach(a => { const o = outcomeOf(a); if (o==='stomped') c.s++; else if (o==='landed') c.l++; else c.f++; }); return c; };
const pctR = (a, b) => b ? Math.round(a / b * 100) : 0;
function monDir(a){
  const t = a.trick || {};
  if (a.discipline==='Rail') return 'Rails';
  if (a.discipline==='Halfpipe') return t.kind==='basic' ? 'Basics' : ((t.sw ? 'Switch ' : '') + (SIDE[t.dir] || '')).trim() || 'Other';
  return DIRN[t.dir] || 'Other';
}
function monBounds(){
  const m = ST.mon, d = new Date(), y = d.getMonth() >= 4 ? d.getFullYear() : d.getFullYear() - 1;   // Saison ab 1. Mai
  if (m.period==='season') return [`${y}-05-01`, ''];
  if (m.period==='last') return [`${y-1}-05-01`, `${y}-04-30`];
  if (m.period==='custom') return [m.from || '', m.to || ''];
  return ['', ''];
}
function monPeriodLabel(){
  const m = ST.mon;
  const p = m.period==='season' ? 'current season' : m.period==='last' ? 'last season' : m.period==='all' ? 'all time' : `${m.from ? fmtDate(m.from) : '…'} – ${m.to ? fmtDate(m.to) : '…'}`;
  return p + (m.typ ? ` · ${m.typ}` : '');
}
function monAttempts(){
  const vis = visibleAthleteIds(ST.me, ST.profiles), [from, to] = monBounds(), typ = ST.mon.typ;
  return ST.attempts.filter(a => vis.has(a.athlete_id) && (!from || sessDate(a) >= from) && (!to || sessDate(a) <= to)
    && (!typ || normType(sessById(a.session_id)?.type)===typ) && srcOk(sessById(a.session_id), monSrc()));
}
// Sessions = Trainingstage (wie Snowboard), aufsteigend
function monDates(list){ return [...new Set(list.map(sessDate))].sort(); }
function monTrend(list, hit){
  const dates = monDates(list); if (dates.length < 2) return null;
  const rate = d => { const l = list.filter(a => sessDate(a)===d); return l.filter(hit).length / l.length; };
  const last = rate(dates[dates.length - 1]), prev = dates.slice(-4, -1).map(rate);
  const diff = last - prev.reduce((a, b) => a + b, 0) / prev.length;
  return {dir: diff >= .05 ? 'up' : diff <= -.05 ? 'down' : 'flat', diff: Math.round(diff * 100)};
}
function monTrendHtml(t){
  if (!t) return '<span class="muted">–</span>';
  if (t.dir==='up') return `<span style="color:${OC.good};font-weight:700">↗ rising, +${t.diff}%</span>`;
  if (t.dir==='down') return `<span style="color:${OC.failed};font-weight:700">↘ falling, ${t.diff}%</span>`;
  return '<span class="muted" style="font-weight:600">→ stable</span>';
}
const isStomp = a => outcomeOf(a)==='stomped', isLanded = a => !a.fell;
function monRing(pct, color, size=92, stroke=9){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ece8e6" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.max(0, Math.min(1, pct)))}"/></svg>`;
}
function monDonut(s, l, f, size=130){
  const n = s + l + f || 1, stroke = 14, r = (size - stroke) / 2, c = 2 * Math.PI * r;
  let off = 0, segs = '';
  for (const [v, col] of [[s, OC.stomped], [l, OC.landed], [f, OC.failed]]){
    if (!v) continue; const fr = v / n;
    segs += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-dasharray="${fr*c} ${c - fr*c}" stroke-dashoffset="${-off*c}"/>`;
    off += fr;
  }
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ece8e6" stroke-width="${stroke}"/>${segs}</svg>`;
}
function monSetPeriod(v){ ST.mon.period = v; renderMonitoring(); }
function monSetTyp(v){ ST.mon.typ = v; renderMonitoring(); }
function monBack(){ if (ST.mon.view==='athlete') ST.mon.src = 'youth'; ST.mon.view = ST.mon.view==='trick' ? 'athlete' : 'team'; renderMonitoring(); window.scrollTo({top:0}); }

let MON_KEYS = [];

    <div class="typechips">${chip('', 'All')}${SESS_TYPES.map(([t]) => chip(t, t)).join('')}</div>

// Trick-Aggregation pro Kern-Trick (Grab-Varianten zusammengefasst)
function monTrickAgg(list){
  const by = {};
  list.forEach(a => { const c = coreOf(a); (by[c.key] ||= {key:c.key, label:c.label, disc:a.discipline, dir:monDir(a), rot:+(a.trick?.rot)||0, list:[]}).list.push(a); });

function renderMonitoring(){
  const root = $('#page-monitoring'), m = ST.mon, all = monAttempts();
  if (m.view==='trick' && !(prof(m.athleteId) && m.key)) m.view = prof(m.athleteId) ? 'athlete' : 'team';
  if (m.view==='athlete' && !prof(m.athleteId)) m.view = 'team';
  if (m.view==='team') return renderMonTeam(root, all);
  if (m.view==='athlete') return renderMonAthlete(root);
  return renderMonTrick(root, all);
}

function renderMonTeam(root, all){
  const aths = [...visibleAthleteIds(ST.me, ST.profiles)].map(prof).filter(Boolean).sort((a,b) => a.name.localeCompare(b.name));
  const groups = [...ST.groups.filter(g => aths.some(a => a.group_id===g.id)), ...(aths.some(a => !a.group_id) ? [{id:null, name:'No group yet'}] : [])];
  const tile = a => {
    const l = all.filter(x => x.athlete_id===a.id), M = monMetric(l), c = M.c, st = M.st;
    const cnt = {ready:0, building:0, critical:0};
    monTrickAgg(l).forEach(t => { const s = monMetric(t.list).st; if (cnt[s] != null) cnt[s]++; });
    return `<div class="mon-tile" onclick="monOpenAthlete('${a.id}')">
      <div class="row" style="gap:10px;flex-wrap:nowrap"><span class="avatar sm">${initials(a.name)}</span><div style="min-width:0"><div class="t">${esc(a.name)}</div><div class="tiny muted">${a.level || '–'}${a.gender ? ' · ' + a.gender : ''}</div></div></div>
      <div class="ringwrap">${monRing(c.n ? M.v / 100 : 0, MON_ST[st].c)}<div class="ringlbl"><b>${c.n ? M.v + '%' : '–'}</b><span>${M.lbl}</span></div></div>
      <div class="tri"><div><b style="color:${MON_ST.ready.c}">${cnt.ready}</b><span>Ready</span></div><div><b style="color:${MON_ST.building.c}">${cnt.building}</b><span>Building</span></div><div><b style="color:${MON_ST.critical.c}">${cnt.critical}</b><span>Critical</span></div></div>
      <div class="more">View details →</div></div>`;
  };
  const [skT, skR] = monStatusKey();
  root.innerHTML = `<div class="card">${monHeader(monSrc()==='elite' ? 'Team Monitoring · Elite app' : 'Team Monitoring', `${all.length} attempts · ${monPeriodLabel()}`, false)}
    <div class="status-key"><span class="status-key-t">${skT}</span>
      ${skR.map(([k, r]) => `<span class="status-pill" style="--c:${MON_ST[k].c}"><i></i><b>${MON_ST[k].l}</b><span>${r}</span></span>`).join('')}
      <span class="status-key-n">${monSrc()==='elite' ? 'Stomped = overall rating «perfect» in the Elite app' : 'Stomped = all criteria met'}</span></div>
    ${groups.map(g => { const list = aths.filter(a => (a.group_id || null)===g.id && (monSrc()==='youth' || hasEliteFor(a.id)));
      return `<div class="sec-lbl">${esc(g.name)}</div><div class="mon-tiles">${list.map(tile).join('')}</div>`; }).join('') || '<div class="empty">No athletes.</div>'}
    <div class="row" style="justify-content:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)">
      <button class="btn ghost sm" style="border-color:#C96A1F;color:#C96A1F;background:#FAEEDF" onclick="realityCheck()">🔍 Reality Check</button>
      <button class="btn ghost sm" onclick="teamPdf()">📄 Team PDF</button></div>
  </div>`;
}

function renderMonAthlete(root){
  const ath = prof(ST.mon.athleteId), keep = ST.mon.src;
  if (!hasEliteFor(ath.id)){ ST.mon.src = 'youth'; root.innerHTML = monAthleteBlock(ath, true, ''); return; }
  const html = ['elite', 'youth'].map((src, i) => { ST.mon.src = src; return monAthleteBlock(ath, i === 0, src==='elite' ? 'Evaluation Elite app (as in the Elite app)' : 'Evaluation Youth app'); }).join('');
  ST.mon.src = keep; root.innerHTML = html;
}
let MON_KEYS_BY = {};
function monAthleteBlock(ath, first, title){
  const src = monSrc(), all = monAttempts(), mine = all.filter(a => a.athlete_id===ath.id), M0 = monMetric(mine), c = M0.c;
  const tricks = monTrickAgg(mine);
  MON_KEYS = MON_KEYS_BY[src] = tricks.map(t => t.key);
  const byDir = {};
  mine.forEach(a => { const d = monDir(a); byDir[d] = (byDir[d] || 0) + 1; });
  const dirs = MON_DIR_ORDER.filter(d => byDir[d]);
  const card = t => {
    const M = monMetric(t.list), k = M.c, st = M.st, i = MON_KEYS_BY[src].indexOf(t.key);
    return `<div class="mon-card ${st==='critical'?'is-crit':''}" onclick="monOpenTrick(${i},'${src}')">
      <div class="t">${esc(t.label)}</div>
      <div class="row" style="flex-wrap:nowrap;gap:12px;margin-top:6px"><div class="big" style="color:${st==='lowdata' ? '#8a8a8f' : MON_ST[st].c}" title="${M.lbl}">${M.v}%</div>
        <div class="mini">Total <b>${k.n}</b><br><span style="color:${OC.stomped}">Stomped <b>${k.s}</b></span><br><span style="color:${OC.landed}">Landed <b>${k.l}</b></span><br><span style="color:${OC.failed}">Fail <b>${k.f}</b></span></div></div>
      <div class="row tiny" style="margin-top:8px">${monTrendHtml(monTrend(t.list, isStomp))}<span class="grow"></span><b style="color:${MON_ST[st].c}">${MON_ST[st].l}</b></div></div>`;
  };
  const sub = `${c.n} attempts · ${c.s} stomped · <b>${M0.v}% ${M0.lbl}</b> · ${monPeriodLabel()}`;
  return `<div class="card">${first ? monHeader(ath.name, title ? '' : sub, true) : ''}
    ${title ? `<div class="mon-src-h ${src}"><b>${title}</b><span class="muted small">${sub}</span></div>` : ''}
    ${c.n ? `<div class="dirbox"><div class="tiny muted" style="font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">Direction balance: session data only</div>
      <div class="dirbar">${dirs.map(d => `<i style="width:${byDir[d] / c.n * 100}%;background:${MON_DIR_COL[d]}" title="${esc(d)}"></i>`).join('')}</div>
      <div class="legend" style="margin-top:8px">${dirs.map(d => `<span><i class="dot" style="background:${MON_DIR_COL[d]}"></i>${esc(d)} <b style="color:${MON_DIR_COL[d]}">${pctR(byDir[d], c.n)}%</b></span>`).join('')}</div></div>` : '<div class="empty">No session data in this period.</div>'}
    ${MON_DIR_ORDER.map(d => { const ts = tricks.filter(t => t.dir===d).sort((a,b) => b.rot - a.rot || b.list.length - a.list.length); if (!ts.length) return '';
      return `<div class="sec-lbl" style="color:${MON_DIR_COL[d]}">${esc(d)}</div><div class="mon-cards">${ts.map(card).join('')}</div>`; }).join('')}
    ${src==='youth' ? `<div class="row" style="justify-content:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)"><button class="btn ghost sm" onclick="athletePdf('${ath.id}')">📄 Athlete Report (PDF)</button></div>` : ''}
  </div>`;

function monCritRates(list, disc){
  const rows = list.filter(a => !a.fell && a.crit);
  return {n:rows.length, rates:critSetFor(disc).map(c => ({name:c.name, pct: rows.length ? pctR(rows.filter(a => a.crit[c.k]).length, rows.length) : null}))};
}
function renderMonTrick(root, all){
  const ath = prof(ST.mon.athleteId), key = ST.mon.key;
  const list = all.filter(a => a.athlete_id===ath.id && coreOf(a).key===key).sort((a,b) => sessDate(a).localeCompare(sessDate(b)) || a.created_at.localeCompare(b.created_at));
  if (!list.length){ ST.mon.view = 'athlete'; return renderMonAthlete(root); }
  const disc = list[0].discipline, label = coreOf(list[0]).label;
  const MT = monMetric(list), c = MT.c, st = MT.st, cr = monCritRates(list, disc);
  // häufigster Fail-Grund + Tendenz (erste vs. zweite Hälfte der Fails)
  const fails = list.filter(a => a.fell), tagc = {};
  fails.forEach(a => parseTags(a.note).forEach(t => tagc[t] = (tagc[t] || 0) + 1));
  const top = Object.entries(tagc).sort((a,b) => b[1] - a[1])[0];
  let failTrend = '';

    const h = Math.floor(fails.length / 2), sh = l => l.filter(a => parseTags(a.note).includes(top[0])).length / l.length;
    const d = sh(fails.slice(h)) - sh(fails.slice(0, h));

  }
  // Varianten & Grabs

  const grabOf = l => l.trick?.grab || (disc==='Rail' ? l.label : 'no grab');
  const badge = st==='ready' ? `<span class="pill" style="border-color:${MON_ST.ready.c};color:${MON_ST.ready.c}">Comp Ready</span>` : `<span class="pill" style="border-color:${MON_ST[st].c};color:${MON_ST[st].c}">${MON_ST[st].l}</span>`;
  root.innerHTML = `<div class="card">${monHeader(label, esc(ath.name) + (monSrc()==='elite' ? ' · <span class="chip elite">Elite app</span>' : ''), true)}</div>
    <div class="card">
      <div class="row" style="justify-content:flex-end">${badge}</div>
      <div class="row" style="gap:22px;align-items:center;flex-wrap:wrap">
        <div class="ringwrap" style="width:130px;height:130px">${monDonut(c.s, c.l, c.f)}<div class="ringlbl"><b style="font-size:26px">${c.n}</b><span>attempts</span></div></div>
        <table class="legtbl">
          <tr><td><i class="sq" style="background:${OC.stomped}"></i>${monSrc()==='elite' ? 'Stomped (overall «perfect»)' : 'Stomped (all criteria)'}</td><td><b>${c.s}</b></td></tr>
          <tr><td><i class="sq" style="background:${OC.landed}"></i>Landed</td><td><b>${c.l}</b></td></tr>
          <tr class="bb"><td><i class="sq" style="background:${OC.failed}"></i>Failed</td><td><b>${c.f}</b></td></tr>
          <tr><td>Landed rate (Landed+Stomped)</td><td><b style="color:${OC.landed}">${pctR(c.s + c.l, c.n)}%</b> ${monTrendHtml(monTrend(list, isLanded))}</td></tr>
          <tr><td>Stomp rate</td><td><b style="color:${monQoeMode() ? OC.stomped : MON_ST[st].c}">${pctR(c.s, c.n)}%</b> ${monTrendHtml(monTrend(list, isStomp))}</td></tr>
          ${monQoeMode() ? `<tr><td>Ø QoE (status as in the Elite app)</td><td><b style="color:${MON_ST[st].c}">${MT.v}%</b></td></tr>` : ''}
        </table>
      </div>
      <div class="sub-h">Criteria fulfillment (Landed + Stomped)</div>
      <div class="chips-row">${cr.n ? cr.rates.map(r => { const col = r.pct >= 80 ? MON_ST.ready.c : r.pct >= 50 ? '#C96A1F' : MON_ST.critical.c; return `<span class="pill" style="border-color:${col};color:${col}">${esc(r.name.replace(/ \(.*\)/, ''))} ${r.pct}%</span>`; }).join('') : '<span class="muted small">No landed attempts yet.</span>'}</div>
      <div class="small" style="margin-top:12px">${top ? `Most common fail reason: <b>${esc(top[0])}</b> (${top[1]}×)${failTrend}` : fails.length ? `${fails.length} failed attempt${fails.length>1?'s':''} without reason` : 'No failed attempts.'}</div>
      ${varRows.length > 1 || (varRows[0] && list[0].trick?.grab) ? `<div class="sub-h">Variants & grabs (${varRows.length})</div>
        <div class="varrow head"><span>Grab</span><span>Attempts</span><span title="Stomped / Landed / Failed">S / L / F</span><span>Stomp rate</span></div>
        ${varRows.map(([l, v]) => { const k = monCounts(v), r = pctR(k.s, k.n), col = k.n < 5 ? '#8a8a8f' : r >= 70 ? MON_ST.ready.c : r >= 40 ? '#C96A1F' : MON_ST.critical.c;
          return `<div class="varrow"><span title="${esc(l)}">${esc(grabOf(v[0]))}</span><span class="muted">${k.n} att.</span><span><b style="color:${OC.stomped}">${k.s}</b>/<b style="color:${OC.landed}">${k.l}</b>/<b style="color:${OC.failed}">${k.f}</b></span><b style="color:${col}">${r}%</b></div>`; }).join('')}` : ''}

    <div class="card"><h2>Progress over sessions</h2>
