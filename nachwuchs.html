function monTimeChart(list){
  const dates = monDates(list).slice(-12);
  const H = 120, slot = 46, barW = 26, PAD = 38, W = PAD + dates.length * slot + 10;
  const yOf = p => 10 + (H - 10) * (1 - p / 100);
  const per = dates.map(d => { const l = list.filter(a => sessDate(a)===d), k = monCounts(l); return {d, k, lr:pctR(k.s + k.l, k.n), sr:pctR(k.s, k.n)}; });
  const maxN = Math.max(1, ...per.map(p => p.k.n));
  let s = '';
  for (const t of [0, 25, 50, 75, 100]) s += `<line x1="${PAD}" x2="${W}" y1="${yOf(t)}" y2="${yOf(t)}" stroke="#e2ddda" ${t ? 'stroke-dasharray="2 4"' : ''}/><text x="${PAD - 5}" y="${yOf(t) + 3}" text-anchor="end" font-size="9" fill="#6b6b70">${t}%</text>`;
  per.forEach((p, i) => {
    const cx = PAD + i * slot + slot / 2, h = Math.max(6, p.k.n / maxN * (H - 10));
    s += `<rect x="${cx - barW/2}" y="${H - h}" width="${barW}" height="${h}" rx="3" fill="${OC.volume}" opacity="${.3 + .55 * p.k.n / maxN}" style="cursor:pointer" onclick="monTimeSel('${p.d}')"><title>${fmtDate(p.d)}: ${p.k.n} attempts</title></rect>`;
    s += `<text x="${cx}" y="${H - h - 4}" text-anchor="middle" font-size="9" fill="${OC.volume}">${p.k.n}</text>`;
    s += `<text x="${cx}" y="${H + 14}" text-anchor="middle" font-size="9.5" fill="${p.k.n < 5 ? '#C96A1F' : '#6b6b70'}">${fmtShort(p.d)}.${p.k.n < 5 ? ' ⚠' : ''}</text>`;
  });
  if (per.length >= 2){
    const pts = k => per.map((p, i) => `${PAD + i * slot + slot / 2},${yOf(p[k])}`).join(' ');
    s += `<polyline fill="none" stroke="${OC.landed}" stroke-width="2" points="${pts('lr')}"/><polyline fill="none" stroke="#C96A1F" stroke-width="2" stroke-dasharray="4 3" points="${pts('sr')}"/>`;
  }
  s += `<text x="${PAD + (W - PAD) / 2}" y="${H + 30}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b6b70">Sessions</text>`;
  return `<div class="chart"><svg width="${W}" height="${H + 36}" viewBox="0 0 ${W} ${H + 36}">${s}</svg></div>`;
}
function monTrickList(){ const all = monAttempts(); return all.filter(a => a.athlete_id===ST.mon.athleteId && coreOf(a).key===ST.mon.key); }
function monTimeSel(d){
  const l = monTrickList().filter(a => sessDate(a)===d), k = monCounts(l);
  $('#mon-time-detail').innerHTML = `<b>${fmtDate(d)}</b>: ${k.n} attempts · <span style="color:${OC.stomped}">${k.s} stomped</span> · <span style="color:${OC.landed}">${k.l} landed</span> · <span style="color:${OC.failed}">${k.f} failed</span> · <b>${pctR(k.s, k.n)}%</b> stomp rate
    <button class="btn ghost sm" style="margin-left:8px" onclick="monOpenSession('${d}')">Open session view →</button>`;
}
function monOpenSession(d){
  const l = monTrickList().filter(a => sessDate(a)===d).sort((a,b) => a.created_at.localeCompare(b.created_at));
  const k = monCounts(l), mx = maxFor(l[0].discipline);
  const H = 90, slot = 30, PAD = 34, W = PAD + l.length * slot + 10, yOf = v => 8 + (H - 8) * (1 - v);
  let s = '';
  for (const [v, t] of [[0, '0★'], [Math.round(mx / 2) / mx, Math.round(mx / 2) + '★'], [1, mx + '★']]) s += `<line x1="${PAD}" x2="${W}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="#e2ddda" ${v ? 'stroke-dasharray="2 4"' : ''}/><text x="${PAD - 5}" y="${yOf(v) + 3}" text-anchor="end" font-size="9" fill="#6b6b70">${t}</text>`;
  let run = 0; const pts = [];
  l.forEach((a, i) => {
    const cx = PAD + i * slot + slot / 2, o = outcomeOf(a), v = a.fell ? 0 : a.score / (a.max || mx);
    if (o==='stomped') run++;
    pts.push(`${cx},${yOf(run / (i + 1))}`);
    const h = a.fell ? 6 : Math.max(4, v * (H - 8));
    s += `<rect x="${cx - 9}" y="${H - h}" width="18" height="${h}" rx="3" fill="${a.fell ? OC.failed : o==='stomped' ? OC.stomped : OC.landed}"><title>#${i + 1} · ${a.fell ? 'Failed' + (parseTags(a.note).length ? ': ' + parseTags(a.note).join(', ') : '') : a.score + '/' + (a.max || mx)}</title></rect>`;
    s += `<text x="${cx}" y="${H + 13}" text-anchor="middle" font-size="9" font-weight="${a.fell ? 800 : 400}" fill="${a.fell ? OC.failed : '#6b6b70'}">${i + 1}</text>`;
  });
  if (l.length > 1) s += `<polyline fill="none" stroke="#9a9396" stroke-width="1.8" points="${pts.join(' ')}"/>`;
  const tags = {}; l.filter(a => a.fell).forEach(a => parseTags(a.note).forEach(t => tags[t] = (tags[t] || 0) + 1));
  const topT = Object.entries(tags).sort((a,b) => b[1] - a[1])[0];
  modal(`<div class="row"><div class="grow"><h3>${esc(coreOf(l[0]).label)}</h3><div class="muted small">${esc(prof(ST.mon.athleteId)?.name)} · Session ${fmtDate(d)}</div></div><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
    <div class="legend" style="margin-top:12px"><span><i class="sq" style="background:${OC.landed}"></i>Landed / <i class="sq" style="background:${OC.stomped}"></i>Stomped (height = criteria met)</span><span><i class="sq" style="background:${OC.failed}"></i>Failed</span><span><i class="ln" style="background:#9a9396"></i>running stomp rate</span></div>
    <div class="chart"><svg width="${W}" height="${H + 30}" viewBox="0 0 ${W} ${H + 30}">${s}<text x="${PAD + (W - PAD) / 2}" y="${H + 27}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b6b70">Attempts</text></svg></div>
    <div class="small" style="margin:8px 0 4px">${k.s} stomped · ${k.l} landed · ${k.f} failed · <b>${pctR(k.s, k.n)}%</b> stomp rate${topT ? ` · ✗ mostly: ${esc(topT[0])} (${topT[1]}×)` : ''}</div>
    <div class="list">${l.map(a => attemptRow(a, {noName:true})).join('')}</div>`);
}

// Coaching Analysis: 6 Regeln wie Snowboard, «KPIs» = unsere Kriterien
function monCoaching(list, disc){
  const dates = monDates(list), nS = dates.length, GREY = '#8a8a8f', AMBER = '#C96A1F', RED = '#D64545';
  const inD = ds => list.filter(a => ds.includes(sessDate(a)));
  const srOf = d => { const l = inD([d]); return l.filter(isStomp).length / l.length; };
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const critOk = ds => { const r = monCritRates(inD(ds), disc); return r.n > 0 && r.rates.every(x => x.pct >= 80); };
  const items = [];
  // 1 Comp-readiness
  if (nS < 3) items.push(['Comp-readiness', `Not enough data (${nS}/3 sessions)`, GREY]);
  else if (critOk(dates.slice(-3))) items.push(['Comp-readiness', 'Reached', GREY]);
  else if (nS >= 4 && critOk(dates.slice(Math.max(0, nS - 6), nS - 3))) items.push(['Comp-readiness', 'Lost: was reached before', RED]);
  else items.push(['Comp-readiness', 'Not reached', AMBER]);
  // 2 Efficiency trend (Stomp-Rate)
  if (nS < 4) items.push(['Efficiency trend', `Not enough data (${nS}/4 sessions)`, GREY]);
  else { const d = Math.round((mean(dates.slice(-3).map(srOf)) - mean(dates.slice(Math.max(0, nS - 6), nS - 3).map(srOf))) * 100);
    items.push(['Efficiency trend', d <= -5 ? `Falling, ${d}% (3 sessions)` : d >= 5 ? `Rising, +${d}% (3 sessions)` : 'Stable (3 sessions)', d <= -5 ? RED : GREY]); }
  // 3 Volume effect
  if (nS < 3) items.push(['Volume effect', `Not enough data (${nS}/3 sessions)`, GREY]);
  else { const vol = dates.map(d => inD([d]).length), av = mean(vol), sa = mean(dates.map(srOf));
    const k = dates.filter((d, i) => vol[i] > 1.5 * av && srOf(d) < sa).length;
    items.push(['Volume effect', k ? `Drops at high volume, cause unclear (${k}×)` : 'No volume effect', k ? AMBER : GREY]); }
  // 4 Plateau
  if (nS < 3) items.push(['Plateau', `Not enough data (${nS}/3 sessions)`, GREY]);
  else { const r3 = dates.slice(-3).map(d => srOf(d) * 100), range = Math.max(...r3) - Math.min(...r3);
    items.push(['Plateau', range < MON_PLATEAU_TOL ? `Flat over last 3 sessions (±${Math.round(range)}%)` : 'None, still moving', range < MON_PLATEAU_TOL ? AMBER : GREY]); }
  // 5 Consistency
  if (nS < 3) items.push(['Consistency', `Not enough data (${nS}/3 sessions)`, GREY]);
  else { const r6 = dates.slice(-6).map(d => srOf(d) * 100), m = mean(r6), sd = Math.sqrt(mean(r6.map(x => (x - m) ** 2)));
    items.push(['Consistency', sd > 15 ? 'Irregular, session to session' : 'Consistent', sd > 15 ? AMBER : GREY]); }
  // 6 Most common fail
  const last3 = inD(dates.slice(-3)), prev = inD(dates.slice(Math.max(0, nS - 6), Math.max(0, nS - 3)));
  const tc = {}; last3.filter(a => a.fell).forEach(a => parseTags(a.note).forEach(t => tc[t] = (tc[t] || 0) + 1));
  const top = Object.entries(tc).sort((a,b) => b[1] - a[1])[0];
  if (!top) items.push(['Most common fail', 'No fail pattern', GREY]);
  else {
    let tr = '', col = AMBER;
    if (prev.length >= 3){ const now = top[1] / last3.length, before = prev.filter(a => a.fell && parseTags(a.note).includes(top[0])).length / prev.length;
      if (now - before >= .05){ tr = ', increasing'; col = RED; } else if (before - now >= .05) tr = ', decreasing'; else tr = ', stable'; }
    items.push(['Most common fail', `${top[0]} (${top[1]}×)${tr}`, col]);
  }
  return `<div class="coach-grid">${items.map(([l, t, col]) => `<div style="border-left:3px solid ${col};padding-left:10px"><div class="tiny muted" style="font-weight:700;letter-spacing:.6px;text-transform:uppercase">${esc(l)}</div><div style="font-weight:600;color:var(--char);font-size:var(--fs-meta)">${esc(t)}</div></div>`).join('')}</div>
    <ul class="hints" style="margin-top:12px"><li>Sessions = training days in the selected period</li><li>Comp-readiness = every criterion ≥ 80% in the last 3 sessions (landed attempts)</li><li>Plateau tolerance ±${MON_PLATEAU_TOL}%</li></ul>`;
}

// PDF direkt herunterladen (ohne Druckfenster): html2pdf.js wird bei Bedarf geladen
let _h2p;
function loadHtml2Pdf(){
  return _h2p ||= new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js'; sc.onload = () => res(window.html2pdf); sc.onerror = () => { _h2p = null; rej(new Error('PDF library could not be loaded')); }; document.head.appendChild(sc); });
}
async function openPrintWindow(title, sub, html, app = APP_TITLE){
  toast('Creating PDF…');
  const logo = document.querySelector('.brand > svg')?.outerHTML || '';
  const box = document.createElement('div');
  box.className = 'pdf-doc';
  box.innerHTML = `<div class="pdf-head"><div><h1>${esc(title)}<span class="dot">.</span></h1><div class="sub">${sub}</div></div><div>${logo}</div></div>
    ${html}<div class="pdf-foot">${esc(app)} · Swiss-Ski · <span>created</span> ${fmtDate(nowIso())}</div>`;
  i18nNode(box);   // übersetzen + Icons, bevor html2pdf den Inhalt kopiert (Container ist nicht im DOM)
  // html2canvas rechnet mit der Scroll-Position: kurz nach oben, danach zurück
  const sx = scrollX, sy = scrollY; window.scrollTo(0, 0);
  try {
    const h2p = await loadHtml2Pdf();
    const file = title.replace(/[^\wÀ-ÿ\- ]+/g, '').trim().replace(/\s+/g, '_') + '.pdf';
    await h2p().set({margin:[10, 10, 12, 10], filename:file, image:{type:'png'},
      html2canvas:{scale:innerWidth < 760 ? 2 : 3, useCORS:true, backgroundColor:'#ffffff', ...(innerWidth < 760 ? {windowWidth:760} : {})},   // Breite 718 px = A4 minus Rand; windowWidth nur auf schmalen Bildschirmen (Desktop-Layout)
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}, pagebreak:{mode:['css'], avoid:['tr','.trick-block','.kpi','.pdf-head','.legend']}}).from(box).save();
    toast('PDF saved');
  } catch (err){ console.error(err); toast('Could not create PDF: ' + (err.message||err), true); }
  finally { window.scrollTo(sx, sy); }
}

// Reality Check: Assessment ↔ Session-Daten (Ø Qualität) wie in der Freeski-App
let RC = null;
function realityCheck(){
  const all = monAttempts(), vis = [...visibleAthleteIds(ST.me, ST.profiles)].map(prof).filter(Boolean).sort((a,b) => a.name.localeCompare(b.name));
  const items = [];
  for (const ath of vis){
    for (const e of entriesOf(ath.id)){
      if (e.status==='rework') continue;
      const key = coreOf(e).key, l = all.filter(a => a.athlete_id===ath.id && coreOf(a).key===key), q = avg(l.map(qa));
      if (e.status!=='goal' && l.length >= 5 && q < 70) items.push({e, ath, dir:'down', n:l.length, q});
      if (e.status==='goal' && l.length >= 3 && q >= 70) items.push({e, ath, dir:'up', n:l.length, q});
    }
  }
  RC = {items, sel:new Set(items.map((_, i) => i)), q:''};
  renderRealityCheck();
}
function renderRealityCheck(){
  const shown = RC.items.map((it, i) => ({...it, i})).filter(it => !RC.q || it.ath.name.toLowerCase().includes(RC.q.toLowerCase()));
  const by = {}; shown.forEach(it => (by[it.ath.id] ||= []).push(it));
  modal(`<h3>Reality Check</h3><ul class="hints" style="margin-top:8px"><li>Assessment vs. session data (${monPeriodLabel()})</li><li><b>↓ Goal</b>: learned trick, Ø quality below 70% (≥5 attempts)</li><li><b>↑ Learned</b>: goal, Ø quality 70% or more (≥3 attempts) → review inbox</li></ul>
    <div class="row" style="margin-bottom:10px"><input type="text" placeholder="Search athlete…" value="${esc(RC.q)}" oninput="RC.q=this.value;renderRealityCheck();setTimeout(()=>{const i=document.querySelector('.modal input[type=text]');i.focus();i.setSelectionRange(i.value.length,i.value.length)},0)" style="max-width:240px">
      <button class="btn ghost sm" onclick="RC.items.forEach((_, i) => RC.sel.add(i));renderRealityCheck()">✓ All</button><button class="btn ghost sm" onclick="RC.sel.clear();renderRealityCheck()">✗ None</button></div>
    ${Object.values(by).map(list => `<div class="sub-h">${esc(list[0].ath.name)}</div>${list.map(it => `<label class="rc-row"><input type="checkbox" ${RC.sel.has(it.i)?'checked':''} onchange="this.checked?RC.sel.add(${it.i}):RC.sel.delete(${it.i})">
        <span class="grow">${esc(it.e.label)}</span><span class="chip ${it.dir==='up'?'green':'gold'}">${it.dir==='up' ? '↑ Learned' : '↓ Goal'}</span><span class="tiny muted">Ø ${it.q}% · ${it.n} att.</span></label>`).join('')}`).join('') || '<div class="empty">Everything matches: no suggestions.</div>'}
    <div class="btnrow"><button class="btn red" ${RC.items.length ? '' : 'disabled'} onclick="applyRealityCheck()">Apply selected (${RC.sel.size})</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}
async function applyRealityCheck(){
  let n = 0;
  try {
    for (const i of RC.sel){
      const {e, dir} = RC.items[i];
      const next = dir==='up' ? {...e, status:'pending', achieved_at:nowIso()} : {...e, status:'goal'};
      upsertLocal(await Store.saveEntry(ST.me, next)); n++;
    }
    closeModal(); toast(`${n} entr${n===1?'y':'ies'} updated`); render();
  } catch (err){ toast('Could not apply: ' + (err.message||err), true); }
}

// Ablauf wie Freeski/Snowboard: Code (6-stellig) statt Link: Links werden von Mail-Scannern verbraucht
function loginMsg(t, ok){ const m = $('#lg-msg'); if (!m) return; m.style.color = ok ? 'var(--muted)' : 'var(--red)'; m.textContent = t; }
async function authForgotPassword(){
  const email = ($('#lg-mail')?.value || '').trim();
  if (isUsername(email)){ loginMsg('Logging in with a username: ask your coach or an admin for a new start password.'); return; }
  if (!email){ loginMsg('Enter your e-mail above first, then tap the link again.'); return; }
  loginMsg('Sending code…', true);
  const { error } = await db.auth.resetPasswordForEmail(email);
  if (error){ loginMsg('Error: ' + error.message); return; }
  showOtpGate(email);
}
// Erstes Mal: Konto selbst aktivieren (nur hinterlegte E-Mails, siehe Update 11)
async function authActivate(){
  const email = ($('#lg-mail')?.value || '').trim().toLowerCase();
  if (isUsername(email)){ loginMsg('Athletes get their username and start password from their coach. Log in with them above.'); return; }
  if (!email){ loginMsg('Enter your e-mail above first, then tap «Activate account» again.'); return; }
  loginMsg('Checking…', true);
  const { data:ok, error:e1 } = await db.rpc('can_register', {p_email:email});
  if (e1){ loginMsg('Error: ' + e1.message); return; }
  if (!ok){ loginMsg('This e-mail is not registered or already has an account. Already have one? Use «Forgot password?». Otherwise contact your coach.'); return; }
  loginMsg('Sending code…', true);
  const { error } = await db.auth.signInWithOtp({email, options:{shouldCreateUser:true}});
  if (error){ loginMsg('Error: ' + error.message); return; }
  showOtpGate(email, 'email');
}
// Code-Eingabe öffnen, ohne eine neue Mail auszulösen (Mail-Limit, verspätete Mail)
function authHaveCode(){
  const email = ($('#lg-mail')?.value || '').trim();
  if (!email){ loginMsg('Enter your e-mail above first, then tap the link again.'); return; }
  showOtpGate(email);
}
function showOtpGate(email, type='recovery'){
  $('#gate').innerHTML = gateShell(`
    <div class="card"><h2>Enter code</h2>
      <p class="lead">We sent a code to</p><p style="margin:2px 0 12px"><b>${esc(email)}</b></p>
      <label class="f">Code<input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" style="text-align:center;font-size:var(--fs-page);letter-spacing:4px" onkeydown="if(event.key==='Enter')doVerifyOtp()"></label>
      <div class="small" id="otp-msg" style="margin-top:10px;min-height:18px;color:var(--red)"></div>
      <div class="btnrow"><button class="btn red" id="otp-btn" onclick="doVerifyOtp()">Verify code</button></div>
      <div class="small" style="margin-top:14px;text-align:center"><a href="#" onclick="showLoginGate();return false">Back to login</a></div></div>`);
  $('#gate').hidden = false; $('#app').hidden = true;
  ST._otpMail = email; ST._otpType = type; $('#otp-code').focus();
}
async function doVerifyOtp(){
  const b = $('#otp-btn'); b.disabled = true;
  const type = ST._otpType || 'recovery';
  const { error } = await db.auth.verifyOtp({email:ST._otpMail, token:$('#otp-code').value.trim(), type});
  b.disabled = false;
  if (error){ $('#otp-msg').textContent = 'Code invalid or expired. Go back and request a new one.'; return; }
  showSetPasswordGate(type === 'recovery');
}
function showSetPasswordGate(reset){
  $('#gate').innerHTML = gateShell(`
    <div class="card"><h2>${reset ? 'Choose a new password' : 'Welcome! Choose your password'}</h2>
      <div style="display:grid;gap:12px">
        <label class="f">New password<input type="password" id="sp-pw" autocomplete="new-password" minlength="8"></label>
        <label class="f">Repeat password<input type="password" id="sp-pw2" autocomplete="new-password" minlength="8" onkeydown="if(event.key==='Enter')doSetPassword()"></label>
      </div>
      <div class="small muted" style="margin-top:6px">At least 8 characters.</div>
      <div class="small" id="sp-msg" style="margin-top:10px;min-height:18px;color:var(--red)"></div>
      <div class="btnrow"><button class="btn red" onclick="doSetPassword()">Save password</button></div></div>`);
  $('#gate').hidden = false; $('#app').hidden = true;
}
async function doSetPassword(){
  const p1 = $('#sp-pw').value, p2 = $('#sp-pw2').value;
  if (p1.length < 8){ $('#sp-msg').textContent = 'At least 8 characters.'; return; }
  if (p1 !== p2){ $('#sp-msg').textContent = 'Passwords do not match.'; return; }
  const { error } = await db.auth.updateUser({password:p1, data:{must_change_password:false}});
  if (error){ $('#sp-msg').textContent = 'Error: ' + error.message; return; }
  history.replaceState(null, '', location.pathname + location.search); toast('Password saved'); await startApp();
}

async function logout(){ await Store.logout(); location.reload(); }

async function loadData(){
  const d = await Store.loadAll(ST.me);
  const me0 = d.profiles.find(p => p.id===ST.me.id) || ST.me;
  // Athlet:innen und Coaches landen immer in ihrer eigenen Sportart
  // Coaches: gleichnamige Gruppe in beiden Sportarten (z.B. RLZ Ski Valais) = gleiche Trägerschaft → beide Sportarten
  const g0 = d.groups.find(g => g.id===me0?.group_id);
  ST.allProfiles = d.profiles; ST.allGroups = d.groups; clubInfo(me0);
  if (!DEMO && me0 && me0.role !== 'dvlp' && !isPreview()){
    const own = ST.mySports.includes(SPORT) ? SPORT : me0.role==='coach' && g0 ? (g0.sport || 'freeski') : (me0.sport || g0?.sport || 'freeski');
    if (own !== SPORT){ location.replace(location.pathname + '?sport=' + own); await new Promise(() => {}); }
  }
  const sp = x => DEMO || (x?.sport || 'freeski') === SPORT;
  const groups = d.groups.filter(sp), gids = new Set(groups.map(g => g.id));
  const profiles = d.profiles.filter(p => p.role !== 'athlete' ? (!p.group_id || gids.has(p.group_id) || p.role==='dvlp') : sp(p));
  const aids = new Set(profiles.filter(p => p.role==='athlete').map(p => p.id));
  const sessions = (d.sessions||[]).filter(sp), sids = new Set(sessions.map(x => x.id));
  Object.assign(ST, {profiles, groups, entries:d.entries.filter(e => aids.has(e.athlete_id)), notes:d.notes, sessions, attempts:(d.attempts||[]).filter(a => sids.has(a.session_id))});
  const me = d.profiles.find(p => p.id===ST.me.id); if (me) ST.me = me;
  const vis = visibleAthletes();
  if (ST.me.role==='athlete') ST.athleteId = ST.me.id;
  else if (!vis.some(a => a.id===ST.athleteId)) ST.athleteId = vis[0]?.id || null;
  try { const k = 'nw-piste-at-' + SPORT, last = +localStorage.getItem(k) || 0;
    if (Date.now() - last > 30 * 60000){ localStorage.setItem(k, Date.now()); pushSnapshots(vis); } } catch(e){}
}

async function startApp(){
  try {
    ST.me = await Store.currentUser();
    if (!ST.me){ DEMO ? showDemoGate() : showLoginGate(); return; }
    if (!DEMO){ const { data } = await db.auth.getUser(); if (data?.user?.user_metadata?.must_change_password){ showSetPasswordGate(false); return; } }
    await loadData();
    if (!DEMO){ Outbox.applyLocal(); renderOutboxBar(); Outbox.flush(); registerSW().then(syncPush); setTimeout(autoVideoCleanup, 4000); }
    restoreSX();
  } catch (err){
    console.error(err);
    DEMO ? showDemoGate() : showLoginGate('Could not load your profile: ' + (err.message||err));
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.innerHTML = '');
  $('#gate').hidden = true; $('#app').hidden = false;
  if (DEMO){ const b = $('#demo-bar'); b.hidden = false; b.innerHTML = `DEMO MODE: data stays in this browser <button onclick="Store.logout().then(()=>location.reload())">Switch user</button>`; }
  ST.page = isStaff() && activeSession() ? 'session' : 'assessment';
  render();
  renderPushBanner();
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !ST.me || DEMO || ST.form || RV || ST.page==='session') return;
  try { await loadData(); render(); } catch {}
});

(async function boot(){
  if (DEMO){ DemoStore.load(); await startApp(); return; }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const hash = location.hash;
  if (/type=(invite|recovery)/.test(hash)){
    await new Promise(r => setTimeout(r, 300)); // supabase-js liest das Token aus dem Hash
    showSetPasswordGate(); return;
  }
  await startApp();
})();
</script>
