<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" width="1000" height="455" font-family="Arial, Helvetica, Liberation Sans, sans-serif"><rect width="1000" height="451" fill="#FFFFFF"/><rect x="0" y="0" width="1000" height="3" fill="#D64545"/><text x="30.00" y="44.00" font-size="22" fill="#D64545" font-weight="bold" letter-spacing="0.5">T4</text><text x="30.00" y="72.00" font-size="12.5" fill="#6B6B70" font-style="italic">Die vier Drehrichtungen Left, Right, Switch Left und Switch Right werden pro Athlet:in von der stärksten bis zur schwächsten geordnet.</text><text x="31.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">MEN</text><line x1="31.00" y1="117.00" x2="484.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="31.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#D64545"/><text x="41.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="41.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">XL</text><rect x="31.00" y="183.33" width="449.00" height="40.33" rx="8" fill="#D64545"/><text x="41.00" y="198.15" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">BEMERKUNG</text><text x="41.00" y="213.16" font-size="11.5" fill="#FFFFFF" font-weight="bold">Die Athlet:innen sollen gemäss ihren individuellen Stärken gefördert werden.</text><text x="31.00" y="248.68" font-size="9.5" fill="#D64545" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="37.00" cy="262.42" r="2.3" fill="#D64545"/><text x="46.00" y="265.68" font-size="11.5" fill="#2C2C2E">In den zwei stärksten Drehrichtungen 1620/1800/1980</text><circle cx="37.00" cy="281.93" r="2.3" fill="#D64545"/><text x="46.00" y="285.19" font-size="11.5" fill="#2C2C2E">In der drittstärksten Drehrichtung mindestens 1440</text><circle cx="37.00" cy="301.44" r="2.3" fill="#D64545"/><text x="46.00" y="304.70" font-size="11.5" fill="#2C2C2E">In der schwächsten Drehrichtung mindestens 1080</text><text x="31.00" y="330.21" font-size="9.5" fill="#D64545" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="37.00" cy="343.95" r="2.3" fill="#D64545"/><text x="46.00" y="347.21" font-size="11.5" fill="#2C2C2E">Jeder Trick muss mit einem unterschiedlichen Grab variiert werden (z.B. Left 1800</text><text x="46.00" y="362.73" font-size="11.5" fill="#2C2C2E">mit Stale, Switch Left 1620 mit Japan, Right 1440 mit Blunt und Switch Right 1080</text><text x="46.00" y="378.25" font-size="11.5" fill="#2C2C2E">mit Safety)</text><circle cx="37.00" cy="394.50" r="2.3" fill="#D64545"/><text x="46.00" y="397.76" font-size="11.5" fill="#2C2C2E">Kreative Take-offs (Nose- und Tailbutter, N’Ollie) können kombiniert werden</text><circle cx="37.00" cy="414.01" r="2.3" fill="#D64545"/><text x="46.00" y="417.27" font-size="11.5" fill="#2C2C2E">Die Tricks können X oder gecarved werden, anzustreben ist beides</text><text x="521.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">WOMEN</text><line x1="521.00" y1="117.00" x2="974.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="521.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#D64545"/><text x="531.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="531.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">L-XL</text><rect x="521.00" y="183.33" width="449.00" height="40.33" rx="8" fill="#D64545"/><text x="531.00" y="198.15" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">BEMERKUNG</text><text x="531.00" y="213.16" font-size="11.5" fill="#FFFFFF" font-weight="bold">Die Athlet:innen sollen gemäss ihren individuellen Stärken gefördert werden.</text><text x="521.00" y="248.68" font-size="9.5" fill="#D64545" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="527.00" cy="262.42" r="2.3" fill="#D64545"/><text x="536.00" y="265.68" font-size="11.5" fill="#2C2C2E">In der stärksten Drehrichtung mindestens einen 1080</text><circle cx="527.00" cy="281.93" r="2.3" fill="#D64545"/><text x="536.00" y="285.19" font-size="11.5" fill="#2C2C2E">In der zweit- und drittstärksten Drehrichtung mindestens je einen 900</text><circle cx="527.00" cy="301.44" r="2.3" fill="#D64545"/><text x="536.00" y="304.70" font-size="11.5" fill="#2C2C2E">In der schwächsten Drehrichtung mindestens einen 720</text><text x="521.00" y="330.21" font-size="9.5" fill="#D64545" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="527.00" cy="343.95" r="2.3" fill="#D64545"/><text x="536.00" y="347.21" font-size="11.5" fill="#2C2C2E">Der 1080 in der stärksten Drehrichtung muss mindestens ein Double</text><text x="536.00" y="362.73" font-size="11.5" fill="#2C2C2E">sein</text><text x="521.00" y="388.24" font-size="9.5" fill="#D64545" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="527.00" cy="401.98" r="2.3" fill="#D64545"/><text x="536.00" y="405.24" font-size="11.5" fill="#2C2C2E">Jeder Trick mit einem unterschiedlichen Grab</text><line x1="496" y1="100.00" x2="496" y2="431.26" stroke="#E7E3E1" stroke-width="1"/></svg>