<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 533" width="1000" height="533" font-family="Arial, Helvetica, Liberation Sans, sans-serif"><rect width="1000" height="494" fill="#FFFFFF"/><rect x="0" y="0" width="1000" height="3" fill="#B08D1E"/><text x="30.00" y="44.00" font-size="22" fill="#B08D1E" font-weight="bold" letter-spacing="0.5">T3</text><text x="30.00" y="72.00" font-size="12.5" fill="#6B6B70" font-style="italic">Die vier Drehrichtungen Left, Right, Switch Left und Switch Right werden pro Athlet:in von der stärksten bis zur schwächsten geordnet.</text><text x="31.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">MEN</text><line x1="31.00" y1="117.00" x2="484.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="31.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#B08D1E"/><text x="41.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="41.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">L-XL</text><rect x="31.00" y="183.33" width="449.00" height="71.37" rx="8" fill="#B08D1E"/><text x="41.00" y="198.15" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">BEMERKUNG</text><text x="41.00" y="213.16" font-size="11.5" fill="#FFFFFF" font-weight="bold">Auf dieser Stufe sollen die Grundlagen für die weiterführenden Doubles gelegt</text><text x="41.00" y="228.68" font-size="11.5" fill="#FFFFFF" font-weight="bold">werden. Die Athlet:innen sollen eine breite Range in die verschiedenen</text><text x="41.00" y="244.20" font-size="11.5" fill="#FFFFFF" font-weight="bold">Drehrichtungen und Achsen kennenlernen und sicher beherrschen.</text><text x="31.00" y="279.72" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="37.00" cy="293.46" r="2.3" fill="#B08D1E"/><text x="46.00" y="296.72" font-size="11.5" fill="#2C2C2E">In allen Drehrichtungen bis 900 (inkl. 540, 720)</text><text x="31.00" y="322.23" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="37.00" cy="335.97" r="2.3" fill="#B08D1E"/><text x="46.00" y="339.23" font-size="11.5" fill="#2C2C2E">L &amp; R Cork 900</text><circle cx="37.00" cy="355.48" r="2.3" fill="#B08D1E"/><text x="46.00" y="358.74" font-size="11.5" fill="#2C2C2E">L &amp; R Misty/Bio 720</text><circle cx="37.00" cy="374.99" r="2.3" fill="#B08D1E"/><text x="46.00" y="378.25" font-size="11.5" fill="#2C2C2E">L &amp; R Switch Cork 900</text><circle cx="37.00" cy="394.50" r="2.3" fill="#B08D1E"/><text x="46.00" y="397.76" font-size="11.5" fill="#2C2C2E">Switch L &amp; R Misty/Bio 900</text><text x="31.00" y="423.27" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="37.00" cy="437.01" r="2.3" fill="#B08D1E"/><text x="46.00" y="440.27" font-size="11.5" fill="#2C2C2E">Jeder Trick soll mit einem anderen Grab variiert werden können</text><circle cx="37.00" cy="456.52" r="2.3" fill="#B08D1E"/><text x="46.00" y="459.78" font-size="11.5" fill="#2C2C2E">Die Tricks können X oder gecarved werden, anzustreben ist beides</text><text x="521.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">WOMEN</text><line x1="521.00" y1="117.00" x2="974.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="521.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#B08D1E"/><text x="531.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="531.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">L</text><rect x="521.00" y="183.33" width="449.00" height="71.37" rx="8" fill="#B08D1E"/><text x="531.00" y="198.15" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">BEMERKUNG</text><text x="531.00" y="213.16" font-size="11.5" fill="#FFFFFF" font-weight="bold">Auf dieser Stufe sollen die Grundlagen für die weiterführenden Doubles gelegt</text><text x="531.00" y="228.68" font-size="11.5" fill="#FFFFFF" font-weight="bold">werden. Die Athlet:innen sollen eine breite Range in die verschiedenen</text><text x="531.00" y="244.20" font-size="11.5" fill="#FFFFFF" font-weight="bold">Drehrichtungen und Achsen kennenlernen und sicher beherrschen.</text><text x="521.00" y="279.72" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="527.00" cy="293.46" r="2.3" fill="#B08D1E"/><text x="536.00" y="296.72" font-size="11.5" fill="#2C2C2E">Forward L &amp; R einen 720</text><circle cx="527.00" cy="312.97" r="2.3" fill="#B08D1E"/><text x="536.00" y="316.23" font-size="11.5" fill="#2C2C2E">In der stärkeren Switch-Drehrichtung einen 720</text><circle cx="527.00" cy="332.48" r="2.3" fill="#B08D1E"/><text x="536.00" y="335.74" font-size="11.5" fill="#2C2C2E">In der schwächeren Switch-Drehrichtung einen 540</text><text x="521.00" y="361.25" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="527.00" cy="374.99" r="2.3" fill="#B08D1E"/><text x="536.00" y="378.25" font-size="11.5" fill="#2C2C2E">Die drei 720 müssen off-axis sein</text><circle cx="527.00" cy="394.50" r="2.3" fill="#B08D1E"/><text x="536.00" y="397.76" font-size="11.5" fill="#2C2C2E">Der 540 in der schwächeren Switch-Drehrichtung darf upright sein</text><circle cx="527.00" cy="414.01" r="2.3" fill="#B08D1E"/><text x="536.00" y="417.27" font-size="11.5" fill="#2C2C2E">Erfolgt der Forward L &amp; R 720 in der Cork-Achse, muss zusätzlich ein Misty/Bio oder</text><text x="536.00" y="432.79" font-size="11.5" fill="#2C2C2E">Flat 540 beherrscht werden</text><circle cx="527.00" cy="449.04" r="2.3" fill="#B08D1E"/><text x="536.00" y="452.30" font-size="11.5" fill="#2C2C2E">Cork 360</text><text x="521.00" y="477.81" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="527.00" cy="491.55" r="2.3" fill="#B08D1E"/><text x="536.00" y="494.81" font-size="11.5" fill="#2C2C2E">Jeder Trick soll mit einem anderen Grab variiert werden können</text><line x1="496" y1="100.00" x2="496" y2="508.80" stroke="#E7E3E1" stroke-width="1"/></svg>