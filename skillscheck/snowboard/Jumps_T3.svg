<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 494" width="1000" height="494" font-family="Arial, Helvetica, Liberation Sans, sans-serif"><rect width="1000" height="494" fill="#FFFFFF"/><rect x="0" y="0" width="1000" height="3" fill="#B08D1E"/><text x="30.00" y="44.00" font-size="22" fill="#B08D1E" font-weight="bold" letter-spacing="0.5">T3</text><text x="30.00" y="72.00" font-size="12.5" fill="#6B6B70" font-style="italic">Die vier Drehrichtungen Frontside, Backside, Cab und Switch Backside werden pro Athlet:in von der stärksten bis zur schwächsten geordnet.</text><text x="31.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">MEN</text><line x1="31.00" y1="117.00" x2="484.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="31.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#B08D1E"/><text x="41.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="41.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">L-XL</text><rect x="31.00" y="183.33" width="449.00" height="71.37" rx="8" fill="#B08D1E"/><text x="41.00" y="198.15" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">BEMERKUNG</text><text x="41.00" y="213.16" font-size="11.5" fill="#FFFFFF" font-weight="bold">Auf dieser Stufe sollen die Grundlagen für die weiterführenden Doubles gelegt</text><text x="41.00" y="228.68" font-size="11.5" fill="#FFFFFF" font-weight="bold">werden. Die Athlet:innen sollen eine breite Range in die verschiedenen</text><text x="41.00" y="244.20" font-size="11.5" fill="#FFFFFF" font-weight="bold">Drehrichtungen und Achsen kennenlernen und sicher beherrschen.</text><text x="31.00" y="279.72" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="37.00" cy="293.46" r="2.3" fill="#B08D1E"/><text x="46.00" y="296.72" font-size="11.5" fill="#2C2C2E">In den zwei stärksten Drehrichtungen ein 1080</text><circle cx="37.00" cy="312.97" r="2.3" fill="#B08D1E"/><text x="46.00" y="316.23" font-size="11.5" fill="#2C2C2E">In der drittstärksten Drehrichtung ein 900</text><circle cx="37.00" cy="332.48" r="2.3" fill="#B08D1E"/><text x="46.00" y="335.74" font-size="11.5" fill="#2C2C2E">In der schwächsten Drehrichtung ein 720</text><text x="31.00" y="361.25" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="37.00" cy="374.99" r="2.3" fill="#B08D1E"/><text x="46.00" y="378.25" font-size="11.5" fill="#2C2C2E">BS oder Switch BS Double Rodeo 900</text><circle cx="37.00" cy="394.50" r="2.3" fill="#B08D1E"/><text x="46.00" y="397.76" font-size="11.5" fill="#2C2C2E">Double 1080 in der stärksten Drehrichtung</text><text x="31.00" y="423.27" font-size="9.5" fill="#B08D1E" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="37.00" cy="437.01" r="2.3" fill="#B08D1E"/><text x="46.00" y="440.27" font-size="11.5" fill="#2C2C2E">Grabvariation</text><circle cx="37.00" cy="456.52" r="2.3" fill="#B08D1E"/><text x="46.00" y="459.78" font-size="11.5" fill="#2C2C2E">Nose- und Tailbutter, N'Ollie</text><text x="521.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">WOMEN</text><line x1="521.00" y1="117.00" x2="974.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="521.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#B08D1E"/><text x="531.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="531.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">L</text><rect x="521.00" y="183.33" width="449.00" height="71.37" rx="8" fill="#B08D1E"/><text x="531.00" y="198.15" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">BEMERKUNG</text><text x="531.00" y="213.16" font-size="11.5" fill="#FFFFFF" font-weight="bold">Auf dieser Stufe sollen die Grundlagen für die weiterführenden Doubles gelegt</text><text x