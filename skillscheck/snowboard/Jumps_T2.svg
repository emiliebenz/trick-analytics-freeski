<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" font-family="Arial, Helvetica, Liberation Sans, sans-serif"><rect width="1000" height="410" fill="#FFFFFF"/><rect x="0" y="0" width="1000" height="3" fill="#396FA8"/><text x="30.00" y="44.00" font-size="22" fill="#396FA8" font-weight="bold" letter-spacing="0.5">T2</text><text x="30.00" y="72.00" font-size="12.5" fill="#6B6B70" font-style="italic">Die vier Drehrichtungen Frontside, Backside, Cab und Switch Backside werden pro Athlet:in von der stärksten bis zur schwächsten geordnet.</text><text x="31.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">MEN</text><line x1="31.00" y1="117.00" x2="484.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="31.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#396FA8"/><text x="41.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="41.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">M-L</text><text x="31.00" y="196.35" font-size="9.5" fill="#396FA8" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="37.00" cy="210.09" r="2.3" fill="#396FA8"/><text x="46.00" y="213.35" font-size="11.5" fill="#2C2C2E">In der stärksten Drehrichtung ein 720</text><circle cx="37.00" cy="229.60" r="2.3" fill="#396FA8"/><text x="46.00" y="232.86" font-size="11.5" fill="#2C2C2E">In der zweit- und drittstärksten Drehrichtung ein 540</text><circle cx="37.00" cy="249.11" r="2.3" fill="#396FA8"/><text x="46.00" y="252.37" font-size="11.5" fill="#2C2C2E">In der schwächsten Drehrichtung ein 360</text><text x="31.00" y="277.88" font-size="9.5" fill="#396FA8" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="37.00" cy="291.62" r="2.3" fill="#396FA8"/><text x="46.00" y="294.88" font-size="11.5" fill="#2C2C2E">Backroll, Tamedog, Wildcat forward und switch</text><circle cx="37.00" cy="311.13" r="2.3" fill="#396FA8"/><text x="46.00" y="314.39" font-size="11.5" fill="#2C2C2E">FS und Cab Underflip, BS und Switch BS Rodeo 540</text><text x="31.00" y="339.90" font-size="9.5" fill="#396FA8" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="37.00" cy="353.64" r="2.3" fill="#396FA8"/><text x="46.00" y="356.90" font-size="11.5" fill="#2C2C2E">360 auch mit Hardway Take-off</text><circle cx="37.00" cy="373.15" r="2.3" fill="#396FA8"/><text x="46.00" y="376.41" font-size="11.5" fill="#2C2C2E">Grabvariation</text><text x="521.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">WOMEN</text><line x1="521.00" y1="117.00" x2="974.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="521.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#396FA8"/><text x="531.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="531.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">M</text><text x="521.00" y="196.35" font-size="9.5" fill="#396FA8" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="527.00" cy="210.09" r="2.3" fill="#396FA8"/><text x="536.00" y="213.35" font-size="11.5" fill="#2C2C2E">In den zwei stärksten Drehrichtungen ein 540</text><circle cx="527.00" cy="229.60" r="2.3" fill="#396FA8"/><text x="536.00" y="232.86" font-size="11.5" fill="#2C2C2E">In den übrigen Drehrichtungen ein 360</text><text x="521.00" y="258.37" font-size="9.5" fill="#396FA8" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="527.00" cy="272.11" r="2.3" fill="#396FA8"/><text x="536.00" y="275.37" font-size="11.5" fill="#2C2C2E">Backroll oder Tamedog</text><circle cx="527.00" cy="291.62" r="2.3" fill="#396FA8"/><text x="536.00" y="294.88" font-size="11.5" fill="#2C2C2E">FS oder Cab Underflip oder BS Rodeo 540</text><text x="521.00" y="320.39" font-size="9.5" fill="#396FA8" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="52