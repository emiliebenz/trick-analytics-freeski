<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 391" width="1000" height="391" font-family="Arial, Helvetica, Liberation Sans, sans-serif"><rect width="1000" height="391" fill="#FFFFFF"/><rect x="0" y="0" width="1000" height="3" fill="#3E8E5A"/><text x="30.00" y="44.00" font-size="22" fill="#3E8E5A" font-weight="bold" letter-spacing="0.5">T1</text><text x="30.00" y="72.00" font-size="12.5" fill="#6B6B70" font-style="italic">Die vier Drehrichtungen Frontside, Backside, Cab und Switch Backside werden pro Athlet:in von der stärksten bis zur schwächsten geordnet.</text><text x="31.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">MEN</text><line x1="31.00" y1="117.00" x2="484.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="31.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#3E8E5A"/><text x="41.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="41.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">S-M</text><text x="31.00" y="196.35" font-size="9.5" fill="#3E8E5A" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="37.00" cy="210.09" r="2.3" fill="#3E8E5A"/><text x="46.00" y="213.35" font-size="11.5" fill="#2C2C2E">In den zwei stärksten Drehrichtungen ein 360</text><circle cx="37.00" cy="229.60" r="2.3" fill="#3E8E5A"/><text x="46.00" y="232.86" font-size="11.5" fill="#2C2C2E">In den übrigen Drehrichtungen ein 180</text><text x="31.00" y="258.37" font-size="9.5" fill="#3E8E5A" font-weight="bold" letter-spacing="1">ACHSE UND FLIPS</text><circle cx="37.00" cy="272.11" r="2.3" fill="#3E8E5A"/><text x="46.00" y="275.37" font-size="11.5" fill="#2C2C2E">Backroll oder Tamedog</text><text x="31.00" y="300.88" font-size="9.5" fill="#3E8E5A" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="37.00" cy="314.62" r="2.3" fill="#3E8E5A"/><text x="46.00" y="317.88" font-size="11.5" fill="#2C2C2E">FS und BS Shifty</text><circle cx="37.00" cy="334.13" r="2.3" fill="#3E8E5A"/><text x="46.00" y="337.39" font-size="11.5" fill="#2C2C2E">Straight Air mit Nose, Tail, Weddle, Melon, Stalefish, Indy</text><circle cx="37.00" cy="353.64" r="2.3" fill="#3E8E5A"/><text x="46.00" y="356.90" font-size="11.5" fill="#2C2C2E">180 auch mit Hardway Take-off</text><text x="521.00" y="110.00" font-size="11" fill="#2C2C2E" font-weight="bold" letter-spacing="2">WOMEN</text><line x1="521.00" y1="117.00" x2="974.00" y2="117.00" stroke="#E7E3E1" stroke-width="1"/><rect x="521.00" y="131.00" width="449.00" height="40.33" rx="8" fill="#3E8E5A"/><text x="531.00" y="145.82" font-size="9.5" fill="#FFFFFF" font-weight="bold" letter-spacing="1">KICKERGRÖSSE</text><text x="531.00" y="160.83" font-size="11.5" fill="#FFFFFF" font-weight="bold">S-M</text><text x="521.00" y="196.35" font-size="9.5" fill="#3E8E5A" font-weight="bold" letter-spacing="1">ROTATION</text><circle cx="527.00" cy="210.09" r="2.3" fill="#3E8E5A"/><text x="536.00" y="213.35" font-size="11.5" fill="#2C2C2E">In den zwei stärksten Drehrichtungen ein 360</text><circle cx="527.00" cy="229.60" r="2.3" fill="#3E8E5A"/><text x="536.00" y="232.86" font-size="11.5" fill="#2C2C2E">In den übrigen Drehrichtungen ein 180</text><text x="521.00" y="258.37" font-size="9.5" fill="#3E8E5A" font-weight="bold" letter-spacing="1">GRABS UND TAKE-OFF</text><circle cx="527.00" cy="272.11" r="2.3" fill="#3E8E5A"/><text x="536.00" y="275.37" font-size="11.5" fill="#2C2C2E">FS und BS Shifty</text><circle cx="527.00" cy="291.62" r="2.3" fill="#3E8E5A"/><text x="536.00" y="294.88" font-size="11.5" fill="#2C2C2E">Straight Air mit Nose, Tail, Weddle, Melon, Stalefish, Indy</text><circle cx="527.00" cy="311.13" r="2.3" fill="#3E8E5A"/><text x="536.00" y="314.39" font-size="11.5" fill="#2C2C2E">180 auch mit Hardway Take-off</text><line x1="496" y1="100.00" x2="496" y2="366.90" stroke="#E7E3E1" stroke-width="1"/></svg>