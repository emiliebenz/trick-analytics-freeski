name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity-Check (kein Deploy bei kaputten JS-Dateien)
        run: |
          for f in js/config.js js/kern.js js/snowboard.js js/freeski.js js/runcheck.js js/boot.js js/nav.js; do
            node --check "$f" || exit 1
          done
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            for (const marker of ['js/config.js', 'js/kern.js', 'js/snowboard.js', 'js/freeski.js', 'js/runcheck.js',
                                  'js/boot.js', 'js/nav.js', 'stil.css', 'runcheck.css', 'page-runcheck', 'grab-block-placeholder']) {
              if (!html.includes(marker)) throw new Error('Pflicht-Marker fehlt in index.html: ' + marker);
            }
            const paare = {'js/config.js':'SPORT_CONFIGS', 'js/snowboard.js':'SnowboardModule',
                           'js/freeski.js':'FreeskiModule', 'js/runcheck.js':'runCheckBoot', 'js/boot.js':'bootSport'};
            for (const [datei, marker] of Object.entries(paare)) {
              if (!fs.readFileSync(datei, 'utf8').includes(marker)) throw new Error(marker + ' fehlt in ' + datei);
            }
            console.log('Sanity-Check OK — alle Dateien parsebar, alle Marker vorhanden');
          "
      - name: Sanity-Check Moguls (kein Deploy bei kaputtem moguls.html)
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('moguls.html', 'utf8');
            const m = html.match(/<script>\n([\s\S]*?)\n<\/script>/);
            if (!m) throw new Error('Moguls-Script nicht gefunden');
            new Function(m[1]);
            for (const marker of ['SUPABASE_URL', 'const TYPES', 'renderLiveSession']) {
              if (!html.includes(marker)) throw new Error('Pflicht-Marker fehlt: ' + marker);
            }
            console.log('Sanity-Check Moguls OK');
          "
      - name: Sanity-Check Youth (kein Deploy bei kaputtem nachwuchs.html)
        id: youth
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('nachwuchs.html', 'utf8');
            const m = html.match(/<script>\n([\s\S]*?)\n<\/script>/);
            if (!m) throw new Error('Youth-Script nicht gefunden');
            new Function(m[1]);
            for (const marker of ['SUPABASE_URL', 'const CATALOG', 'function evaluate', 'renderSession', 'renderMonitoring']) {
              if (!html.includes(marker)) throw new Error('Pflicht-Marker fehlt: ' + marker);
            }
            const url = (html.match(/const SUPABASE_URL = '([^']*)'/) || [])[1];
            // Ohne Supabase-URL liefe die Seite im Demo-Modus — dann noch nicht veröffentlichen.
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=' + (url ? 'true' : 'false') + '\n');
            console.log('Sanity-Check Youth OK' + (url ? '' : ' — SUPABASE_URL leer, Deploy wird übersprungen'));
          "
      - name: Stage unified app
        run: mkdir -p stage && cp index.html stil.css manifest-*.webmanifest stage/ && cp -R icons js stage/
      - name: Stage moguls app
        run: mkdir -p stage-moguls/icons && cp moguls.html stage-moguls/index.html && mkdir -p stage-moguls/js && cp js/ui-regeln.js stage-moguls/js/ && cp manifest-moguls.webmanifest stage-moguls/ && cp icons/*moguls* stage-moguls/icons/
      - name: Stage youth app
        run: mkdir -p stage-youth/icons && cp nachwuchs.html stage-youth/index.html && cp sw-youth.js stage-youth/ && cp manifest-youth.webmanifest stage-youth/ && cp icons/*youth* stage-youth/icons/ && cp -r skillscheck stage-youth/
      - name: Deploy Freeski
        run: npx netlify-cli@17 deploy --prod --dir=stage
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 3ec7cd00-5e2b-4858-ac07-9aac22f50906
      - name: Deploy Snowboard
        run: npx netlify-cli@17 deploy --prod --dir=stage
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: c3ce99ae-488d-4c6a-9de1-1e575ee6457f
      - name: Deploy Moguls
        run: npx netlify-cli@17 deploy --prod --dir=stage-moguls
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 101487f5-ab31-40a0-a50b-18cbdd51c49d
      - name: Deploy Youth (Skills-Check Freeski)
        if: steps.youth.outputs.ready == 'true'
        run: npx netlify-cli@17 deploy --prod --dir=stage-youth
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 7e8f675b-8b9b-4ba7-b873-ec87ffa1efa7
